const CTX_LARI="Andi, Budi, Cici, Dedi, dan Eka mengikuti lomba lari. Tidak ada yang finis bersamaan. Diketahui:<ul><li>Budi finis paling akhir.</li><li>Cici finis setelah Eka, tetapi sebelum Andi.</li><li>Dedi finis tepat setelah Cici.</li></ul>";
const CTX_TIM="Sebuah tim beranggotakan tepat 3 orang akan dipilih dari G, H, J, K, L, dan M dengan aturan:<ul><li>G dan H tidak boleh dipilih bersama.</li><li>Jika J dipilih, K harus dipilih.</li><li>L hanya boleh dipilih jika M juga dipilih.</li></ul>";
const CTX_PIKET="Lima pegawai, yaitu V, W, X, Y, dan Z, mendapat jadwal piket Senin sampai Jumat, satu orang per hari. Diketahui:<ul><li>W piket hari Kamis.</li><li>Y piket setelah W.</li><li>X piket sebelum Z dan sebelum V.</li><li>Z tidak piket hari Rabu.</li></ul>";
const CTX_TINGGI="Lima anak, yaitu Rani, Sinta, Tono, Umar, dan Vina, memiliki tinggi badan yang berbeda-beda. Diketahui:<ul><li>Umar adalah anak paling tinggi.</li><li>Rani lebih tinggi daripada Sinta.</li><li>Vina lebih pendek daripada Rani, tetapi lebih tinggi daripada Sinta.</li><li>Tono lebih pendek daripada Sinta.</li></ul>";
const CTX_KOTA="Kota A, B, C, D, dan E terletak pada satu jalan lurus yang membentang dari barat ke timur. Diketahui:<ul><li>Kota B berada 10 km di sebelah timur kota A.</li><li>Kota C berada 4 km di sebelah barat kota B.</li><li>Kota D berada 3 km di sebelah timur kota C.</li><li>Kota E berada 2 km di sebelah barat kota A.</li></ul>";
ADD.analitis=[
{ctx:CTX_KURSI,q:"Siapa yang duduk di kursi nomor 3?",o:["A","B","D","E","Tidak dapat ditentukan"],a:2,ex:"E–B harus berdampingan di kursi (2,3) atau (5,6). Kalau B di kursi 3, B bersebelahan dengan F di kursi 4, padahal tidak boleh. Jadi E di 5 dan B di 6. A dan D mengisi kursi 2 dan 3. D tidak boleh di 2 (dekat C), jadi <b>D di kursi 3</b> dan A di kursi 2. Susunan akhirnya: C A D F E B."},
{ctx:CTX_KURSI,q:"Siapa yang duduk di kursi paling kanan?",o:["B","D","E","F","A"],a:0,ex:"Susunannya <b>C – A – D – F – E – B</b>. Paling kanan (kursi 6) adalah <b>B</b>."},
{ctx:CTX_KURSI,q:"Pernyataan berikut yang benar adalah ...",o:["A duduk tepat di sebelah kanan D","E duduk tepat di sebelah kanan F","C duduk bersebelahan dengan D","B duduk di kursi nomor 5","F duduk di antara A dan D"],a:1,ex:"Dari susunan C(1) A(2) D(3) F(4) <b>E(5)</b> B(6), E tepat di sebelah kanan F."},
{ctx:CTX_LANTAI,q:"Kantor yang berada di lantai 3 adalah ...",o:["P","R","S","T","Q"],a:0,ex:"Q di lantai 5. R di bawah P tetapi bukan di lantai 1. Kalau P di lantai 2, R harus di lantai 1, padahal tidak boleh. Jadi P–S di lantai 3–4, R di lantai 2, T di lantai 1. <b>Lantai 3 = P</b>."},
{ctx:CTX_LANTAI,q:"Kantor yang berada di lantai paling bawah adalah ...",o:["P","Q","R","S","T"],a:4,ex:"Susunan dari bawah: <b>T</b>, R, P, S, Q."},
{ctx:CTX_LANTAI,q:"Pernyataan berikut yang benar adalah ...",o:["Kantor R berada tepat di bawah kantor S","Kantor S berada tepat di bawah kantor Q","Kantor T berada di lantai 2","Kantor P berada di atas kantor S","Kantor Q berada tepat di atas kantor P"],a:1,ex:"Urutan dari bawah: T(1), R(2), P(3), S(4), Q(5). Jadi <b>S tepat di bawah Q</b>."},
{ctx:CTX_LARI,q:"Siapa yang finis di urutan kedua?",o:["Andi","Cici","Dedi","Eka","Budi"],a:1,ex:"Budi di posisi 5. Urutan E sebelum C, D tepat setelah C, dan A setelah C. Satu-satunya susunan: <b>Eka, Cici, Dedi, Andi, Budi</b>. Posisi kedua: Cici."},
{ctx:CTX_LARI,q:"Dedi finis di urutan ke ...",o:["Pertama","Kedua","Ketiga","Keempat","Kelima"],a:2,ex:"Eka(1), Cici(2), <b>Dedi(3)</b>, Andi(4), Budi(5)."},
{ctx:CTX_LARI,q:"Pernyataan berikut yang pasti benar adalah ...",o:["Andi finis sebelum Dedi","Eka menjadi juara pertama","Cici finis tepat sebelum Andi","Budi finis tepat setelah Dedi","Dedi finis di urutan kedua"],a:1,ex:"Urutannya Eka, Cici, Dedi, Andi, Budi. Jadi <b>Eka juara pertama</b>."},
{ctx:CTX_TIM,q:"Susunan tim berikut yang memenuhi semua aturan adalah ...",o:["G, H, M","H, J, K","J, L, M","G, K, L","H, J, M"],a:1,ex:"Cek satu per satu. G,H,M melanggar (G dan H bersama). J,L,M melanggar (J tanpa K). G,K,L melanggar (L tanpa M). H,J,M melanggar (J tanpa K). Yang lolos: <b>H, J, K</b>."},
{ctx:CTX_TIM,q:"Jika J dipilih, anggota lain yang pasti ikut dipilih adalah ...",o:["G","H","K","L","M"],a:2,ex:"Aturan langsung: J dipilih → <b>K</b> wajib dipilih."},
{ctx:CTX_TIM,q:"Jika G dan L dipilih, anggota ketiga tim adalah ...",o:["H","J","K","M","Tidak dapat ditentukan"],a:3,ex:"L hanya boleh dipilih jika M dipilih. Jadi anggota ketiga pasti <b>M</b>."},
{ctx:CTX_PIKET,q:"Siapa yang piket hari Rabu?",o:["V","X","Y","Z","W"],a:0,ex:"W Kamis, Y setelah W → Y Jumat. X, Z, V mengisi Senin–Rabu. X sebelum Z dan V → X Senin. Z bukan Rabu → Z Selasa, jadi <b>V Rabu</b>."},
{ctx:CTX_PIKET,q:"Z piket pada hari ...",o:["Senin","Selasa","Rabu","Kamis","Jumat"],a:1,ex:"Jadwalnya: Senin X, <b>Selasa Z</b>, Rabu V, Kamis W, Jumat Y."},
{ctx:CTX_PIKET,q:"Pernyataan berikut yang benar adalah ...",o:["V piket sebelum Z","X piket paling awal","Y piket hari Kamis","Z piket tepat sebelum W","W piket paling akhir"],a:1,ex:"<b>X piket hari Senin</b>, paling awal dalam minggu itu."},
{ctx:CTX_TINGGI,q:"Anak tertinggi kedua adalah ...",o:["Rani","Sinta","Tono","Vina","Umar"],a:0,ex:"Umar tertinggi. Rani > Vina > Sinta > Tono. Jadi urutannya Umar, <b>Rani</b>, Vina, Sinta, Tono."},
{ctx:CTX_TINGGI,q:"Anak yang paling pendek adalah ...",o:["Rani","Sinta","Tono","Vina","Tidak dapat ditentukan"],a:2,ex:"Urutan dari tertinggi: Umar, Rani, Vina, Sinta, <b>Tono</b>."},
{ctx:CTX_TINGGI,q:"Pernyataan berikut yang benar adalah ...",o:["Sinta lebih tinggi daripada Vina","Vina lebih tinggi daripada Tono","Rani adalah anak tertinggi","Tono lebih tinggi daripada Sinta","Vina berada di urutan kedua"],a:1,ex:"Vina di urutan ketiga, Tono di urutan kelima. Jadi <b>Vina lebih tinggi daripada Tono</b>."},
{ctx:CTX_KOTA,q:"Kota yang letaknya paling timur adalah ...",o:["A","B","C","D","E"],a:1,ex:"Anggap A = 0 km. B = 10, C = 6, D = 9, E = −2. Paling timur (angka terbesar) adalah <b>B</b>."},
{ctx:CTX_KOTA,q:"Jarak antara kota E dan kota D adalah ...",o:["7 km","9 km","10 km","11 km","12 km"],a:3,ex:"E = −2 dan D = 9. Jaraknya 9 − (−2) = <b>11 km</b>."},
{ctx:CTX_KOTA,q:"Kota yang terletak di antara kota C dan kota B adalah ...",o:["A","D","E","Tidak ada","A dan E"],a:1,ex:"Urutan dari barat: E(−2), A(0), C(6), <b>D(9)</b>, B(10)."},
{q:"Jika hari ini hari Rabu, maka 100 hari lagi adalah hari ...",o:["Kamis","Jumat","Sabtu","Minggu","Senin"],a:1,ex:"Satu minggu = 7 hari. 100 ÷ 7 = 14 sisa <b>2</b>. Rabu + 2 hari = <b>Jumat</b>."}
];
ADD.silog=[
["Semua siswa memakai seragam. Rudi tidak memakai seragam. Kesimpulannya ...",["Rudi adalah siswa","Rudi bukan siswa","Rudi mungkin siswa","Sebagian siswa tidak memakai seragam","Tidak dapat disimpulkan"],1,"Siswa → seragam. Tidak berseragam → <b>bukan siswa</b>."],
["Jika lampu lalu lintas merah, kendaraan berhenti. Lampu lalu lintas merah. Kesimpulannya ...",["Kendaraan berjalan","Kendaraan berhenti","Kendaraan mungkin berhenti","Lampu akan hijau","Tidak dapat disimpulkan"],1,"<b>Modus ponens</b>: p → q, p benar, maka q."],
["Jika saya lapar, saya makan. Saya makan. Kesimpulannya ...",["Saya lapar","Saya tidak lapar","Saya kenyang","Saya mungkin lapar","Tidak dapat ditarik kesimpulan yang pasti"],4,"Jebakan! Makan bisa karena alasan lain. Dari 'q benar' kita <b>tidak bisa</b> menyimpulkan p."],
["Jika hujan, Andi membawa payung. Hari ini tidak hujan. Kesimpulannya ...",["Andi tidak membawa payung","Andi membawa payung","Andi lupa payung","Hari cerah","Tidak dapat ditarik kesimpulan yang pasti"],4,"Dari 'tidak p' kita <b>tidak bisa</b> menyimpulkan 'tidak q'. Andi bisa saja tetap membawa payung."],
["Tidak ada kucing yang bisa terbang. Semua anggora adalah kucing. Kesimpulannya ...",["Sebagian anggora bisa terbang","Tidak ada anggora yang bisa terbang","Semua yang tidak bisa terbang adalah anggora","Sebagian kucing adalah anggora yang bisa terbang","Tidak dapat disimpulkan"],1,"Anggora masuk kelompok kucing, dan tidak ada kucing yang terbang. Jadi <b>tidak ada anggora yang bisa terbang</b>."],
["Dina pergi ke pasar atau ke bank. Dina tidak pergi ke pasar. Kesimpulannya ...",["Dina pergi ke pasar","Dina pergi ke bank","Dina di rumah","Dina pergi ke pasar dan bank","Tidak dapat disimpulkan"],1,"<b>Silogisme disjungtif</b>: p atau q, tidak p, maka q."],
["Ingkaran dari 'Ada siswa yang tidak hadir' adalah ...",["Semua siswa tidak hadir","Semua siswa hadir","Ada siswa yang hadir","Tidak ada siswa","Beberapa siswa hadir"],1,"Ingkaran 'ada ... tidak' adalah '<b>semua ...</b>'. Jadi: <b>semua siswa hadir</b>."],
["Ingkaran dari 'Andi rajin dan pintar' adalah ...",["Andi tidak rajin dan tidak pintar","Andi tidak rajin atau tidak pintar","Andi rajin atau pintar","Andi malas dan bodoh","Andi rajin tetapi tidak pintar"],1,"Rumus: ingkaran (p dan q) = <b>tidak p atau tidak q</b>. 'Dan' berubah menjadi 'atau'."],
["Kontraposisi dari 'Jika hujan, maka jalan basah' adalah ...",["Jika jalan basah, maka hujan","Jika tidak hujan, maka jalan tidak basah","Jika jalan tidak basah, maka tidak hujan","Hujan dan jalan tidak basah","Jika jalan basah, maka tidak hujan"],2,"Kontraposisi: <b>balik dan ingkari keduanya</b> → jika tidak q maka tidak p. Pernyataan ini setara dengan aslinya."],
["Pernyataan 'Jika ia lulus, maka ia senang' setara dengan ...",["Ia lulus dan ia senang","Ia tidak lulus atau ia senang","Ia lulus atau ia tidak senang","Jika ia senang, maka ia lulus","Jika ia tidak lulus, maka ia tidak senang"],1,"p → q setara dengan <b>tidak p atau q</b>, juga setara dengan kontraposisinya."],
["Beberapa pegawai adalah lulusan teknik. Tidak ada lulusan teknik yang bekerja di bagian keuangan. Kesimpulannya ...",["Semua pegawai bekerja di bagian keuangan","Beberapa pegawai tidak bekerja di bagian keuangan","Tidak ada pegawai di bagian keuangan","Semua lulusan teknik adalah pegawai","Beberapa pegawai bagian keuangan adalah lulusan teknik"],1,"Pegawai yang lulusan teknik pasti tidak di bagian keuangan. Jadi <b>beberapa pegawai tidak bekerja di bagian keuangan</b>."],
["Semua pegawai mengikuti apel pagi. Sebagian pegawai berangkat naik bus. Kesimpulannya ...",["Semua yang naik bus mengikuti apel","Sebagian peserta apel pagi berangkat naik bus","Semua peserta apel naik bus","Tidak ada peserta apel yang naik bus","Sebagian pegawai tidak mengikuti apel"],1,"Pegawai yang naik bus juga ikut apel. Jadi <b>sebagian peserta apel naik bus</b>."],
["Jika harga turun, permintaan naik. Jika permintaan naik, produksi bertambah. Harga turun. Kesimpulannya ...",["Produksi berkurang","Produksi bertambah","Permintaan turun","Harga akan naik","Tidak dapat disimpulkan"],1,"Rantai: harga turun → permintaan naik → <b>produksi bertambah</b>."],
["Semua manajer memakai dasi. Semua yang memakai dasi tampak rapi. Bayu tidak tampak rapi. Kesimpulannya ...",["Bayu seorang manajer","Bayu bukan manajer","Bayu memakai dasi","Bayu mungkin manajer","Tidak dapat disimpulkan"],1,"Manajer → berdasi → rapi. Bayu tidak rapi → tidak berdasi → <b>bukan manajer</b>."],
["Saya pergi hanya jika cuaca cerah. Ternyata saya pergi. Kesimpulannya ...",["Cuaca hujan","Cuaca cerah","Cuaca mungkin cerah","Saya tidak pergi","Tidak dapat disimpulkan"],1,"'p hanya jika q' artinya p → q. Saya pergi → <b>cuaca cerah</b>."],
["Semua pegawai instansi X memiliki sertifikat keahlian. Rina memiliki sertifikat keahlian. Kesimpulannya ...",["Rina pegawai instansi X","Rina bukan pegawai instansi X","Rina pasti lulus seleksi","Semua pemilik sertifikat adalah pegawai X","Tidak dapat ditarik kesimpulan yang pasti"],4,"Pemilik sertifikat tidak hanya pegawai X. Arahnya tidak bisa dibalik, jadi <b>tidak ada kesimpulan pasti</b>."],
["Pernyataan 'Tidak semua peserta lulus' setara dengan ...",["Semua peserta tidak lulus","Ada peserta yang tidak lulus","Tidak ada peserta yang lulus","Semua peserta lulus","Sebagian besar peserta lulus"],1,"'Tidak semua' = <b>ada yang tidak</b>."],
["Ingkaran dari 'Andi berangkat atau Budi berangkat' adalah ...",["Andi tidak berangkat atau Budi tidak berangkat","Andi tidak berangkat dan Budi tidak berangkat","Andi berangkat dan Budi tidak berangkat","Andi dan Budi berangkat","Budi berangkat"],1,"Ingkaran (p atau q) = <b>tidak p dan tidak q</b>."]
];

ADD.pelayanan=[
["Seorang warga datang mengurus dokumen tetapi lupa membawa salah satu berkas persyaratan. Saya akan ...",["Memintanya pulang dan kembali besok","Menjelaskan berkas yang kurang, memeriksa apakah bisa dipenuhi secara digital, dan memberinya daftar persyaratan lengkap","Memberinya daftar persyaratan lalu mempersilakannya kembali","Menerima berkas tanpa memeriksa kelengkapannya","Meminta rekan lain yang melayaninya"],[2,5,4,1,3],"Skor 5 mencari <b>jalan keluar</b> (opsi digital) dan mencegah warga bolak-balik lagi."],
["Antrean warga sedang panjang, sementara beberapa rekan ingin istirahat makan siang bersamaan. Saya akan ...",["Ikut istirahat bersama mereka","Mengusulkan istirahat bergantian agar loket tetap melayani","Menunda istirahat saya sampai antrean habis","Menutup loket sementara","Membiarkan rekan mengatur sendiri"],[1,5,4,2,3],"Mengatur <b>sistem bergantian</b> menjaga layanan tetap jalan tanpa mengorbankan hak istirahat. Menunda istirahat sendiri baik, tapi solusinya hanya sesaat."],
["Seorang warga bertanya tentang layanan yang bukan tugas unit saya. Saya akan ...",["Mengatakan itu bukan urusan saya","Menunjukkan arah unit yang tepat","Mengantarkan atau menghubungi unit yang tepat dan memastikan warga terlayani","Memintanya bertanya ke satpam","Menyarankannya mencari informasi di internet"],[1,4,5,2,3],"Pelayanan prima tidak berhenti di 'bukan bagian saya'. <b>Pastikan warga sampai ke tujuan</b>."],
["Seorang warga lansia lebih lancar berbahasa daerah dan kesulitan memahami penjelasan saya. Saya akan ...",["Menjelaskan ulang dengan bahasa sederhana dan meminta bantuan rekan yang menguasai bahasa daerahnya","Menjelaskan ulang dengan suara lebih keras","Memintanya datang bersama anggota keluarga","Memberinya brosur tertulis","Menjelaskan ulang dengan bahasa yang lebih sederhana"],[5,2,3,1,4],"Menyesuaikan cara komunikasi dengan kebutuhan warga, termasuk <b>bahasa daerah</b>, menunjukkan kepekaan pelayanan."],
["Kotak saran unit saya berisi kritik pedas bahwa layanan kami lambat. Saya akan ...",["Membuangnya karena bahasanya kasar","Menganalisis penyebab keterlambatan bersama tim dan mengusulkan perbaikan","Menyampaikannya kepada atasan","Menjelaskan kepada warga bahwa kami sudah bekerja keras","Mengabaikannya karena hanya satu orang"],[1,5,4,3,2],"Kritik adalah data. Skor 5 mengubahnya menjadi <b>tindakan perbaikan</b>."],
["Saya menilai prosedur layanan di unit saya terlalu berbelit dan membuat warga menunggu lama. Saya akan ...",["Tetap menjalankannya karena sudah menjadi aturan","Melewati beberapa tahap tanpa izin agar cepat","Menyusun usulan penyederhanaan prosedur disertai data dan menyampaikannya kepada atasan","Mengeluhkannya kepada rekan kerja","Menyampaikan keluhan tersebut kepada atasan secara lisan"],[3,1,5,2,4],"Inovasi tetap harus <b>lewat jalur resmi dan berbasis data</b>. Melompati prosedur tanpa izin berisiko."],
["Seorang warga meminta berkasnya didahulukan karena anggota keluarganya sedang dirawat dan butuh dokumen itu segera. Saya akan ...",["Menolak karena semua harus sesuai antrean","Memeriksa ketentuan layanan prioritas atau darurat dan mendahulukannya bila memenuhi syarat","Langsung mendahulukannya tanpa memeriksa","Memintanya meminta izin kepada atasan","Menyarankannya datang lebih pagi besok"],[2,5,3,4,1],"Kepedulian tetap <b>dalam koridor aturan</b>. Banyak instansi punya mekanisme layanan prioritas untuk kondisi darurat."],
["Seorang warga menuduh saya sengaja mempersulit urusannya. Saya akan ...",["Membalas tuduhannya dengan tegas","Tetap tenang, menjelaskan aturan yang berlaku, dan menunjukkan dasar hukumnya","Meminta atasan menanganinya","Diam dan melanjutkan pekerjaan","Tetap tenang dan menjelaskan aturan secara lisan"],[1,5,3,2,4],"Tenang dan <b>transparan</b>. Menunjukkan dasar aturannya membuat warga paham bahwa ini bukan keputusan pribadi."],
["Seseorang meminta salinan data kependudukan milik tetangganya dengan alasan untuk keperluan keluarga. Saya akan ...",["Memberikannya karena ia mengaku keluarga","Menolak dengan sopan dan menjelaskan bahwa data pribadi hanya dapat diberikan kepada pemiliknya atau dengan kuasa yang sah","Meminta fotokopi KTP-nya lalu memberikan data","Menolak tanpa penjelasan","Menyarankannya meminta langsung kepada tetangganya"],[1,5,2,3,4],"Data pribadi dilindungi undang-undang. Tolak, lalu <b>jelaskan prosedur yang benar</b>."],
["Hasil survei kepuasan masyarakat menunjukkan nilai unit saya paling rendah di kantor. Saya akan ...",["Menganggap survei itu tidak akurat","Mengajak tim membahas hasil survei dan menyusun rencana perbaikan","Memperbaiki cara kerja saya sendiri","Menunggu arahan atasan","Menyalahkan unit lain yang terkait"],[2,5,4,3,1],"Skor 5 melibatkan <b>seluruh tim</b>, karena kepuasan warga adalah hasil kerja bersama."],
["Saya melihat rekan bersikap ketus kepada warga yang banyak bertanya. Saya akan ...",["Ikut mengambil alih melayani warga tersebut, lalu mengingatkan rekan secara pribadi","Menegurnya di depan warga","Membiarkan karena bukan urusan saya","Melaporkannya kepada atasan","Mengingatkannya secara pribadi setelah selesai"],[5,2,1,3,4],"Warga terlayani dulu, lalu rekan diingatkan <b>tanpa dipermalukan</b>."],
["Seorang warga penyandang tunanetra perlu mengisi formulir layanan. Saya akan ...",["Memintanya membawa pendamping","Membacakan formulir, membantu mengisikannya sesuai jawabannya, dan memastikan ia memahami isinya","Mengisikan formulir berdasarkan perkiraan saya","Memberinya formulir untuk dibawa pulang","Meminta rekan lain membantunya"],[2,5,1,3,4],"Pelayanan inklusif: bantu dengan <b>tetap menghormati keputusan warga</b>. Mengisi berdasarkan perkiraan sendiri itu keliru."],
["Banyak warga bingung menggunakan aplikasi layanan baru di kantor saya. Saya akan ...",["Membuat panduan sederhana bergambar dan mendampingi warga yang kesulitan","Meminta warga belajar sendiri","Melayani secara manual saja","Memasang pengumuman cara penggunaan","Mendampingi warga yang meminta bantuan"],[5,1,2,3,4],"Solusi sistematis (panduan) <b>ditambah</b> pendampingan langsung."],
["Kantor saya mengadakan layanan jemput bola ke desa pada hari Sabtu dan saya diminta ikut. Saya akan ...",["Menolak karena hari libur","Bersedia ikut dan mempersiapkan perlengkapan layanan dengan baik","Ikut jika ada uang lembur","Ikut tetapi pulang lebih awal","Bersedia ikut"],[1,5,2,3,4],"Kesediaan melayani <b>disertai persiapan</b> membuat layanan efektif."],
["Saya bertugas sebagai admin media sosial instansi dan menerima pengaduan warga pada malam hari. Saya akan ...",["Mengabaikannya sampai jam kerja","Membalas bahwa pengaduan diterima, mencatatnya, dan menindaklanjutinya ke unit terkait pada jam kerja","Langsung menelepon pejabat terkait malam itu","Menghapus pengaduan agar akun terlihat baik","Mencatatnya untuk ditindaklanjuti besok"],[2,5,3,1,4],"Respons cepat bahwa pengaduan <b>diterima</b>, lalu ditindaklanjuti sesuai SOP. Warga merasa didengar."],

 const cs=getComputedStyle(document.documentElement);const cols=['--accent','--twk','--tiu','--tkp','--good'].map(v=>cs.getPropertyValue(v).trim());
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length],life:0});
 if(!raf)raf=requestAnimationFrame(step)}
function step(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
 parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*.1)));cx.restore()});
 parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);raf=parts.length?requestAnimationFrame(step):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}
