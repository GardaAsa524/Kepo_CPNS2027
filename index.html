<title>Kepo CPNS 2027</title>
<meta name="description" content="Latihan soal SKD CPNS (TWK, TIU, TKP) bergaya jalur pelajaran.">

<style>
/* Layout: one phone-width column; a winding lesson path per SKD subtest (TWK, TIU, TKP), lesson screen with bottom feedback sheet */
:root{
  --bg:#F5F3FA; --surface:#FFFFFF; --surface-2:#EFECF7; --ink:#1E1B3A; --muted:#6B6788; --line:#E2DEEF; --line-d:#CFC9E3;
  --accent:#FFB400; --accent-d:#D18E00; --accent-ink:#5C3A00;
  --twk:#E0453A; --twk-d:#AF2E25; --twk-bg:#FDE7E4;
  --tiu:#5A57D6; --tiu-d:#3C39A6; --tiu-bg:#E8E7FB;
  --tkp:#0F9E8D; --tkp-d:#0A7366; --tkp-bg:#DDF4F0;
  --good:#1E9E5A; --good-d:#157443; --good-bg:#DCF4E6; --good-ink:#0E5A33;
  --bad:#D93848; --bad-d:#A72634; --bad-bg:#FCE3E5; --bad-ink:#8A1C28;
  --lock:#D8D4E6; --lock-d:#BDB7D2;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13112A; --surface:#1E1B3A; --surface-2:#272347; --ink:#F2F0FF; --muted:#A6A2C8; --line:#302B55; --line-d:#3E386A;
  --accent:#FFC233; --accent-d:#C98F00; --accent-ink:#3A2500;
  --twk:#F0625A; --twk-d:#B23A33; --twk-bg:#3A1C22;
  --tiu:#7D7AF0; --tiu-d:#4F4CB8; --tiu-bg:#262457;
  --tkp:#2BC2AE; --tkp-d:#14857A; --tkp-bg:#123A38;
  --good:#3DC27A; --good-d:#22874F; --good-bg:#12362A; --good-ink:#9DEBC0;
  --bad:#F0606E; --bad-d:#AE3442; --bad-bg:#3D1A22; --bad-ink:#FFB3BB;
  --lock:#38335E; --lock-d:#2A264A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13112A; --surface:#1E1B3A; --surface-2:#272347; --ink:#F2F0FF; --muted:#A6A2C8; --line:#302B55; --line-d:#3E386A;
  --accent:#FFC233; --accent-d:#C98F00; --accent-ink:#3A2500;
  --twk:#F0625A; --twk-d:#B23A33; --twk-bg:#3A1C22;
  --tiu:#7D7AF0; --tiu-d:#4F4CB8; --tiu-bg:#262457;
  --tkp:#2BC2AE; --tkp-d:#14857A; --tkp-bg:#123A38;
  --good:#3DC27A; --good-d:#22874F; --good-bg:#12362A; --good-ink:#9DEBC0;
  --bad:#F0606E; --bad-d:#AE3442; --bad-bg:#3D1A22; --bad-ink:#FFB3BB;
  --lock:#38335E; --lock-d:#2A264A; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.app{max-width:540px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 32px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:2px solid var(--line);margin-bottom:16px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:22px;margin-right:auto}
.brand small{font-family:var(--f-body);font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);display:block;line-height:1;margin-top:-2px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800;padding:6px 8px;border-radius:12px}
.stat:hover{background:var(--surface-2)}
.stat svg{width:22px;height:22px}
.st-streak{color:var(--accent-d)} .st-heart{color:var(--bad)} .st-xp{color:var(--tiu)}
:root[data-theme="dark"] .st-streak{color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-streak{color:var(--accent)}}
.st-streak.off{color:var(--muted)}

/* ---------- goal card ---------- */
.goal{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.ring{position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface-2)} .ring .val{stroke:var(--accent);transition:stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:20px;line-height:1}
.ring b span{display:block;font-family:var(--f-body);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.goal h2{font-size:20px}
.goal p{margin:2px 0 10px;color:var(--muted);font-size:14px}
.week{display:flex;gap:4px;min-width:0}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted)}
.day i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2)}
.day i svg{width:15px;height:15px;opacity:.35}
.day.met i{background:var(--accent)} .day.met i svg{opacity:1;color:var(--accent-ink)}
.day.today{color:var(--ink)} .day.today i{box-shadow:0 0 0 2px var(--accent)}
.goal-edit{font-size:13px;font-weight:700;color:var(--tiu);text-decoration:underline;text-underline-offset:3px}

.info{display:flex;gap:12px;align-items:flex-start;background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:13px;color:var(--muted);margin-bottom:24px}
.info strong{color:var(--ink)}
.info table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
.info td{padding:1px 10px 1px 0}

/* ---------- path ---------- */
.unit{margin-bottom:28px}
.uhead{border-radius:20px;padding:16px 18px;color:#fff;background:var(--c);box-shadow:0 5px 0 var(--cd);display:flex;gap:12px;align-items:center}
.uhead .tag{font-size:12px;font-weight:800;letter-spacing:.1em;opacity:.85}
.uhead h2{font-size:22px;color:#fff}
.uhead p{margin:2px 0 0;font-size:13px;opacity:.92}
.uhead .meta{margin-left:auto;text-align:right;font-family:var(--f-display);font-size:26px;line-height:1;flex:none}
.uhead .meta span{display:block;font-family:var(--f-body);font-size:10px;font-weight:700;letter-spacing:.08em;opacity:.85}
.nodes{display:flex;flex-direction:column;align-items:center;gap:30px;padding:52px 0 8px}
.nwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px}
.node{width:76px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--cd);display:grid;place-items:center;color:#fff;transition:transform .12s, box-shadow .12s;position:relative}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--cd)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--muted)}
.node.cur{animation:breathe 2.2s ease-in-out infinite}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--c);opacity:.35}
.nlabel{font-size:13px;font-weight:700;color:var(--muted);text-align:center;max-width:140px;line-height:1.25}
.nlabel b{display:block;color:var(--ink)}
.bubble{position:absolute;top:-44px;background:var(--surface);border:2px solid var(--line);color:var(--c);font-weight:800;font-size:14px;letter-spacing:.06em;padding:4px 12px;border-radius:12px;animation:bob 1.6s ease-in-out infinite;white-space:nowrap}
.bubble::after{content:"";position:absolute;left:50%;bottom:-8px;width:12px;height:12px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.reps{position:absolute;top:-4px;right:-6px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;padding:0 5px;border:2px solid var(--bg)}
@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes bob{50%{transform:translateY(-5px)}}

.mascot-row{display:flex;align-items:flex-end;gap:10px;margin:0 0 20px}
.speech{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:14px;font-weight:600;position:relative;min-width:0}
.speech::before{content:"";position:absolute;left:-9px;bottom:16px;width:14px;height:14px;background:var(--surface);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.kepo{flex:none;animation:hover 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-4px)}}

/* ---------- buttons ---------- */
.btn{display:block;width:100%;padding:14px 18px;border-radius:16px;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;background:var(--b,var(--tiu));color:#fff;box-shadow:0 5px 0 var(--bd,var(--tiu-d));transition:transform .1s, box-shadow .1s, filter .2s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 var(--bd,var(--tiu-d))}
.btn:disabled{background:var(--lock);box-shadow:0 5px 0 var(--lock-d);color:var(--muted);cursor:default}
.btn.ghost{background:transparent;box-shadow:none;color:var(--tiu);border:2px solid var(--line)}
.btn.good{--b:var(--good);--bd:var(--good-d)} .btn.bad{--b:var(--bad);--bd:var(--bad-d)}

/* ---------- lesson ---------- */
.lesson{display:flex;flex-direction:column;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));padding-bottom:0}
.lbar{display:flex;align-items:center;gap:12px;padding-block:16px}
.x{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted)}
.x:hover{background:var(--surface-2)}
.prog{flex:1;height:16px;border-radius:8px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;width:0;border-radius:8px;background:var(--good);transition:width .5s cubic-bezier(.3,1.4,.5,1);position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:2px;background:rgba(255,255,255,.35)}
.combo{font-family:var(--f-display);font-size:15px;color:var(--accent-d);height:22px;text-align:center;font-weight:800;opacity:0;transition:opacity .3s}
.combo.on{opacity:1;animation:pop .4s}
.qbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:24px}
.chip{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.08em;padding:4px 10px;border-radius:8px;background:var(--cbg);color:var(--c)}
.qtext{font-size:19px;font-weight:700;line-height:1.45;margin:0}
.qtext em{font-style:normal;background:var(--surface-2);padding:0 6px;border-radius:6px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);font-weight:600;font-size:15px;transition:transform .1s, box-shadow .1s, border-color .15s, background .15s;animation:rise .35s backwards}
.opt:nth-child(2){animation-delay:.04s}.opt:nth-child(3){animation-delay:.08s}.opt:nth-child(4){animation-delay:.12s}.opt:nth-child(5){animation-delay:.16s}
.opt .k{flex:none;width:28px;height:28px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--muted)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 0 0 var(--line)}
.opt.sel{border-color:var(--tiu);background:var(--tiu-bg);box-shadow:0 4px 0 var(--tiu)}
.opt.sel .k{border-color:var(--tiu);color:var(--tiu)}
.opt.right{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.opt.right .k{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad);animation:shake .4s}
.opt.wrong .k{border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.opt .pts{margin-left:auto;flex:none;font-size:12px;font-weight:800;color:var(--muted)}
.ctx{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14.5px;line-height:1.55}
.ctx b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.ctx ul{margin:6px 0 0;padding-left:20px}
.figbox{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;overflow-x:auto}
.figrow{display:flex;align-items:center;gap:6px;justify-content:center;min-width:max-content}
.fsvg{color:var(--ink);display:block;flex:none}
.figq{width:60px;height:60px;border:2px dashed var(--c);border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;color:var(--c);flex:none}
.figsep{font-family:var(--f-display);font-size:22px;color:var(--muted)}
.figopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}
.figopts .opt{flex-direction:column;gap:6px;padding:10px 8px}
.foot{position:sticky;bottom:0;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2px solid var(--line);background:var(--bg)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.9,.25,1.1)}
.sheet.on{transform:none}
.sheet-in{max-width:540px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--sbg);border-radius:24px 24px 0 0;color:var(--sink)}
.sheet.good{--sbg:var(--good-bg);--sink:var(--good-ink)} .sheet.bad{--sbg:var(--bad-bg);--sink:var(--bad-ink)}
.sheet.mid{--sbg:color-mix(in srgb,var(--accent) 22%,var(--surface));--sink:var(--ink)}
.sh-h{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:24px;font-weight:800}
.sh-h .ic{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;animation:pop .45s}
.sh-h .ic svg{width:22px;height:22px}
.sh-ans{font-size:14px;font-weight:700;margin:6px 0 0}
.sh-ex{font-size:14.5px;line-height:1.55;margin:8px 0 14px;max-height:34vh;overflow:auto;color:var(--ink);background:var(--surface);border-radius:14px;padding:12px 14px}
.sh-ex b{color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ---------- results ---------- */
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding-top:32px}
.res h1{font-size:34px;color:var(--accent-d)}
.res .sub{color:var(--muted);margin:-8px 0 0;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.card{border:2px solid var(--c);border-radius:16px;overflow:hidden;animation:rise .5s backwards}
.card:nth-child(2){animation-delay:.15s}.card:nth-child(3){animation-delay:.3s}
.card h3{background:var(--c);color:#fff;font-family:var(--f-body);font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px}
.card div{font-family:var(--f-display);font-size:26px;font-weight:800;padding:8px 4px;color:var(--c)}
.gbar{width:100%;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px 16px;text-align:left}
.gbar .row{display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-bottom:8px}
.gbar .track{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden}
.gbar .track i{display:block;height:100%;background:var(--accent);border-radius:7px;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1) .4s}
.flame-big{animation:pop .6s .2s backwards}
.met-banner{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:10px 14px;font-weight:800;width:100%;animation:pop .5s .9s backwards}
.res .actions{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:8px}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:30;background:rgba(15,12,40,.55);display:grid;place-items:end center;animation:fade .2s}
.modal[hidden]{display:none!important}
.mbox{width:100%;max-width:540px;background:var(--surface);border-radius:24px 24px 0 0;padding:22px max(16px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .35s cubic-bezier(.2,.9,.25,1.1)}
.mbox h2{font-size:24px;margin-bottom:4px}
.mbox > p{color:var(--muted);margin:0 0 16px;font-size:14px}
.goals{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.gopt{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border:2px solid var(--line);border-radius:16px;box-shadow:0 4px 0 var(--line);font-weight:700;text-align:left;gap:10px}
.gopt small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.gopt span{font-family:var(--f-display);font-size:18px;color:var(--muted);flex:none}
.gopt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:0 4px 0 var(--accent-d)}
.gopt.sel span{color:var(--accent-d)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(100%)}}

.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:.001;transform:translateY(12px)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:12px;font-weight:700;font-size:14px;z-index:50;animation:enter .3s}
.foot-note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
.lvl{display:flex;flex-direction:column;align-items:center;gap:2px;margin:22px 0 0;text-align:center}
.lvl span{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--c);background:var(--cbg);padding:4px 12px;border-radius:999px}
.lvl.off span{color:var(--muted);background:var(--surface-2)}
.lvl small{font-size:12px;color:var(--muted);font-weight:600}
.node.hard:not(.locked){box-shadow:0 7px 0 var(--cd),0 0 0 4px var(--accent) inset}
.quick{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--tiu);color:#fff;border-radius:20px;padding:14px 16px;box-shadow:0 5px 0 var(--tiu-d);margin-bottom:14px;transition:transform .1s,box-shadow .1s}
.quick:active{transform:translateY(5px);box-shadow:0 0 0 var(--tiu-d)}
.quick .qi{flex:none;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center}
.quick .qi svg{width:26px;height:26px}
.quick b{display:block;font-family:var(--f-display);font-size:19px}
.quick small{display:block;font-size:13px;opacity:.9;line-height:1.35}
.prog-all{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:12px}
.prog-all .track{grid-column:1/-1;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.prog-all .track i{display:block;height:100%;background:var(--good);border-radius:5px}
.nine{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center}
.nine > div{display:grid;place-items:center}
.nine .nq{width:52px;height:52px;border:2px dashed var(--c);border-radius:8px;font-family:var(--f-display);font-size:24px;color:var(--c)}
.tblwrap{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.dtbl caption{text-align:left;font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding-bottom:6px}
.dtbl th,.dtbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right}
.dtbl th:first-child,.dtbl td:first-child{text-align:left}
.dtbl th{color:var(--muted);font-size:12px}
.qtext sup{font-size:.7em}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:380px){.qtext{font-size:17px}.cards div{font-size:22px}.brand small{display:none}}
</style>

<div class="app" id="app"></div>
<canvas id="fx"></canvas>
<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<script>
/* ================= UTIL ================= */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtN(x){const neg=x<0;x=Math.abs(x);let [i,d]=(Math.round(x*1000)/1000).toString().split('.');i=i.replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (neg?'−':'')+i+(d?','+d:'')}
const rp=x=>'Rp'+fmtN(x);
const pad=n=>String(n).padStart(2,'0');
const clock=m=>`${pad(Math.floor(m/60)%24)}.${pad(m%60)}`;
function mk(ans,cands,fmt=String){const seen=new Set([fmt(ans)]),o=[fmt(ans)];
 for(const c of shuffle(cands)){if(typeof c==='number'&&(!isFinite(c)))continue;const s=fmt(c);if(!seen.has(s)&&o.length<5){seen.add(s);o.push(s)}}
 let k=1;while(o.length<5&&typeof ans==='number'){for(const c of [ans+k,ans-k]){const s=fmt(c);if(!seen.has(s)&&o.length<5){seen.add(s);o.push(s)}}k++}
 return o}
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a||1};
const lcm=(a,b)=>a/gcd(a,b)*b;
const Fr=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d);return {n:n/g,d:d/g}};
const fAdd=(a,b)=>Fr(a.n*b.d+b.n*a.d,a.d*b.d), fSub=(a,b)=>Fr(a.n*b.d-b.n*a.d,a.d*b.d), fMul=(a,b)=>Fr(a.n*b.n,a.d*b.d);
function fStr(f){if(f.d===1)return fmtN(f.n);const neg=f.n<0,n=Math.abs(f.n),w=Math.floor(n/f.d),r=n%f.d;return (neg?'−':'')+(w?w+' ':'')+r+'/'+f.d}

/* ================= FIGURAL SVG ================= */
const SV=(inner,s=60)=>`<svg class="fsvg" viewBox="0 0 64 64" width="${s}" height="${s}" aria-hidden="true"><rect x="2" y="2" width="60" height="60" rx="8" fill="none" stroke="currentColor" stroke-width="2" opacity=".3"/>${inner}</svg>`;
const FILL=acc=>acc?'style="fill:var(--accent)"':'fill="currentColor"';
const CHI={F:'M22 12h22v9H31v7h10v9H31v15h-9Z',L:'M21 12h10v30h14v10H21Z',P:'M18 10h6v44h-6Z M24 12 L46 20 L24 28Z',S:'M26 18h24v12H38v12H14V30h12Z'};
const chi=(t,rot,mir,acc)=>SV(`<g transform="rotate(${rot} 32 32)${mir?' translate(64 0) scale(-1 1)':''}"><path d="${CHI[t]}" ${FILL(acc)}/></g>`);
const ckey=(t,rot,mir)=>`${t}${mir?'m':''}${((rot%360)+360)%360}`;
function shp(t,cx,cy,r,acc){const f=FILL(acc);
 if(t==='c')return `<circle cx="${cx}" cy="${cy}" r="${r}" ${f}/>`;
 if(t==='s')return `<rect x="${cx-r*.85}" y="${cy-r*.85}" width="${r*1.7}" height="${r*1.7}" ${f}/>`;
 return `<path d="M${cx} ${cy-r} L${cx+r*.95} ${cy+r*.75} H${cx-r*.95} Z" ${f}/>`}
const fNest=(o,i)=>SV(shp(o,32,32,24,false)+shp(i,32,32,9,true));
const fDots=n=>{let g='';for(let i=0;i<n;i++){g+=`<circle cx="${14+(i%4)*12}" cy="${20+Math.floor(i/4)*12}" r="4.2" fill="currentColor"/>`}return SV(g)};
const fCells=(b,g)=>{let s='';for(let k=0;k<4;k++){const fill=k===b?'fill="currentColor"':k===g?'style="fill:var(--accent)"':'fill="none"';s+=`<rect x="${6+k*13.5}" y="25" width="11" height="14" rx="2" ${fill} stroke="currentColor" stroke-width="1.6"/>`}return SV(s)};
const POS={1:[[32,32]],2:[[21,32],[43,32]],3:[[16,32],[32,32],[48,32]]};
const fMulti=(t,n,acc,s=52)=>SV(POS[n].map(([x,y])=>shp(t,x,y,n===3?7.5:9,acc)).join(''),s);
const row=(...a)=>`<div class="figrow">${a.join('')}</div>`;
const QM='<span class="figq">?</span>', SEP=t=>`<span class="figsep">${t}</span>`;
const SHN={c:'lingkaran',s:'persegi',t:'segitiga'};

/* ================= GENERATOR: TIU ================= */
const G={};
G.deret=lv=>{const T=lv===1?pick(['ar','ar','geo','sq']):lv===2?pick(['ting','larik','mix','geo']):pick(['fib','ting2','larik2','cube','mix']);
 let s=[],ans,ex,d=[],two=false;
 if(T==='ar'){const k=pick([3,4,5,6,7,8,9,11,12,13]),neg=Math.random()<.3,a=neg?R(70,120):R(1,30);for(let i=0;i<6;i++)s.push(a+(neg?-k:k)*i);
  ex=`Selisih antarsuku selalu <b>${neg?'−':'+'}${k}</b>. Ini deret aritmetika biasa, jadi ${fmtN(s[4])} ${neg?'−':'+'} ${k} = <b>${fmtN(s[5])}</b>.`}
 else if(T==='geo'){const r=pick([2,3]),a=r===2?R(1,6):R(1,3);for(let i=0;i<6;i++)s.push(a*r**i);
  ex=`Tiap suku <b>dikali ${r}</b>. Kalau selisihnya makin lama makin besar dan rapi berlipat, curigai deret kali. ${fmtN(s[4])} × ${r} = <b>${fmtN(s[5])}</b>.`}
 else if(T==='sq'){const st=R(1,5),c=pick([0,1,-1,2,3]);for(let i=0;i<6;i++){const n=st+i;s.push(n*n+c)}
  ex=`Ini bilangan <b>kuadrat ${c?(c>0?'+ '+c:'− '+(-c)):''}</b>: ${st}², ${st+1}², ${st+2}², dan seterusnya${c?`, masing-masing ${c>0?'ditambah':'dikurangi'} ${Math.abs(c)}`:''}. Berikutnya ${st+5}² ${c?(c>0?'+ '+c:'− '+(-c)):''} = <b>${s[5]}</b>.`}
 else if(T==='ting'||T==='ting2'){let a=R(2,20),df=R(1,5),inc=T==='ting'?pick([1,2,3]):R(1,3),t=R(1,2);s.push(a);
  for(let i=0;i<6;i++){d.push(df);s.push(s[s.length-1]+df);df+=inc;if(T==='ting2')inc+=t}
  s=s.slice(0,T==='ting'?6:7);
  ex=T==='ting'?`Lihat selisihnya: ${d.slice(0,4).map(x=>'+'+x).join(', ')}. Selisihnya naik <b>${d[1]-d[0]}</b> tiap langkah (deret bertingkat). Berikutnya +${d[4]}, jadi <b>${s[5]}</b>.`
  :`Selisih tingkat 1: ${d.slice(0,5).map(x=>'+'+x).join(', ')}. Selisihnya lagi (tingkat 2) juga naik teratur, jadi ini <b>deret bertingkat dua</b>. Selisih berikutnya +${d[5]}, hasilnya <b>${s[6]}</b>.`}
 else if(T==='larik'||T==='larik2'){two=true;let a1=R(2,12),k1=T==='larik'?R(2,7):2,a2=R(20,45),k2=R(2,6);const odd=[],even=[];
  for(let i=0;i<4;i++){odd.push(T==='larik'?a1+k1*i:a1*k1**i);even.push(a2-k2*i)}
  for(let i=0;i<3;i++)s.push(odd[i],even[i]);ans=`${odd[3]}, ${even[3]}`;
  const opts=mk(ans,[`${even[3]}, ${odd[3]}`,`${odd[3]+(T==='larik'?k1:odd[2])}, ${even[3]}`,`${odd[3]}, ${even[3]-k2}`,`${odd[2]+1}, ${even[3]+1}`,`${odd[3]}, ${even[3]+k2}`]);
  return {q:`${s.join(', ')}, ..., ...`,o:opts,a:0,ex:`Angkanya naik-turun, tanda <b>deret 2 larik</b>. Pisahkan posisi ganjil dan genap.<br>Ganjil: ${odd.slice(0,3).join(', ')} (${T==='larik'?'+'+k1:'×2'}) → <b>${odd[3]}</b><br>Genap: ${even.slice(0,3).join(', ')} (−${k2}) → <b>${even[3]}</b>`}}
 else if(T==='mix'){const p=R(1,4),q=2;let x=R(1,5);s.push(x);for(let i=0;i<5;i++){x=i%2===0?x+p:x*q;s.push(x)}
  ex=`Operasinya <b>bergantian</b>: +${p}, ×${q}, +${p}, ×${q}, ... Suku terakhir yang tampil didapat dari +${p}, jadi berikutnya <b>×${q}</b>: ${s[4]} × ${q} = <b>${s[5]}</b>.`}
 else if(T==='fib'){let a=R(1,6),b=R(2,8);s=[a,b];for(let i=0;i<5;i++)s.push(s[s.length-1]+s[s.length-2]);
  ex=`Tiap suku = <b>jumlah dua suku sebelumnya</b> (pola Fibonacci). ${s[4]} + ${s[5]} = <b>${s[6]}</b>.`}
 else if(T==='cube'){const c=pick([0,1,-1,2]);for(let n=1;n<=6;n++)s.push(n**3+c);
  ex=`Ini bilangan <b>pangkat tiga</b> ${c?(c>0?'+ '+c:'− 1'):''}: 1³, 2³, 3³, ... Berikutnya 6³ ${c?(c>0?'+ '+c:'− 1'):''} = <b>${s[5]}</b>.`}
 ans=s[s.length-1];const shown=s.slice(0,-1);const last=shown[shown.length-1],gap=ans-last;
 return {q:`${shown.map(fmtN).join(', ')}, ...`,o:mk(ans,[ans+1,ans-1,ans+gap,last+gap-2,ans+2,ans-2,ans*2-last+1],fmtN),a:0,ex}};

G.hitung=()=>{const T=pick(['persen','pecahan','desimal','pangkat']);
 if(T==='persen'){const p=pick([5,10,12.5,15,20,25,40,60,75]),N=40*R(3,40),a=p*N/100;const tip={25:'¼',50:'½',20:'⅕',12.5:'⅛',75:'¾',10:'1/10'}[p];
  return {q:`${fmtN(p)}% dari ${fmtN(N)} adalah ...`,o:mk(a,[a+N/20,a-N/40,N*p/1000,a*2,a+10],fmtN),a:0,ex:`${tip?`Trik: ${fmtN(p)}% = <b>${tip}</b>, jadi tinggal ${fmtN(N)} × ${tip}. `:`Hitung ${fmtN(N)} × ${fmtN(p)} ÷ 100. `}Hasilnya <b>${fmtN(a)}</b>.`}}
 if(T==='pecahan'){const D=[2,3,4,5,6,8];const f=()=>{const d=pick(D);let n;do{n=R(1,d*2-1)}while(n%d===0);return {n,d}};const a=f(),b=f(),c=f();const op1=pick(['+','−','×']),op2=pick(['+','−']);
  const t1=op1==='×'?fMul(a,b):op1==='+'?fAdd(a,b):fSub(a,b);const ans=op1==='×'?(op2==='+'?fAdd(t1,c):fSub(t1,c)):(op2==='+'?fAdd(t1,c):fSub(t1,c));
  const wrong=[Fr(ans.n+1,ans.d),Fr(ans.n-1,ans.d),Fr(ans.n,ans.d*2),Fr(ans.n*2+1,ans.d*2),fAdd(ans,Fr(1,2)),fAdd(ans,Fr(1,4)),fSub(ans,Fr(1,3)),Fr(ans.n+2,ans.d)];
  const s=x=>`${x.n}/${x.d}`;
  return {q:`${s(a)} ${op1} ${s(b)} ${op2} ${s(c)} = ...`,o:mk(fStr(ans),wrong.map(fStr)),a:0,
   ex:`${op1==='×'?`Ingat urutan: <b>kali dulu</b>. ${s(a)} × ${s(b)} = ${fStr(t1)}.`:`Samakan penyebut dulu, lalu hitung dari kiri. ${s(a)} ${op1} ${s(b)} = ${fStr(t1)}.`} Kemudian ${fStr(t1)} ${op2} ${s(c)} = <b>${fStr(ans)}</b>.`}}
 if(T==='desimal'){const a=pick([0.25,0.5,0.75,1.5,2.5,0.2,0.4]),b=R(2,20)*0.2,c=R(1,9)/10;const ab=Math.round(a*b*1000)/1000,ans=Math.round((ab+c)*1000)/1000;
  return {q:`${fmtN(a)} × ${fmtN(b)} + ${fmtN(c)} = ...`,o:mk(ans,[Math.round((a*(b+c))*1000)/1000,ans+0.1,ans-0.1,ab,ans*10],fmtN),a:0,
   ex:`Kerjakan <b>perkalian dulu</b>: ${fmtN(a)} × ${fmtN(b)} = ${fmtN(ab)}. Baru ditambah ${fmtN(c)} → <b>${fmtN(ans)}</b>. Tips: ubah desimal ke pecahan kalau lebih mudah, misal 0,25 = ¼.`}}
 const k=R(6,15),p=R(2,4),m=R(2,5),ans=k*k===0?0:k+2**p*m;
 return {q:`√${k*k} + 2<sup>${p}</sup> × ${m} = ...`,o:mk(ans,[(k+2**p)*m,k+2*p*m,k*k+2**p*m,ans+2,ans-m]),a:0,ex:`√${k*k} = ${k}, dan 2<sup>${p}</sup> = ${2**p}. Kali dulu: ${2**p} × ${m} = ${2**p*m}. Jadi ${k} + ${2**p*m} = <b>${ans}</b>.`}};

const XYO=['x > y','x < y','x = y','x dan y tidak dapat ditentukan','x = 2y'];
G.xy=lv=>{for(let tries=0;tries<50;tries++){const T=pick(lv>=3?['tak','per','frac','kuad','tak']:['per','frac','kuad','tak']);let x,y,q,ex,rel;
 if(T==='per'){const P=[10,15,20,25,30,40,50,60,75],p=pick(P),pp=pick(P),A=40*R(2,25),B=40*R(2,25);x=p*A/100;y=pp*B/100;q=`x = ${p}% dari ${fmtN(A)}<br>y = ${pp}% dari ${fmtN(B)}`;ex=`x = <b>${fmtN(x)}</b>, y = <b>${fmtN(y)}</b>.`}
 else if(T==='frac'){const L=[[1,4],[3,8],[2,5],[5,8],[3,4],[7,20],[9,25],[3,5]],[n,d]=pick(L),v=n/d,off=pick([0,0,0.01,-0.01,0.05,-0.05,0.025]);x=v;y=Math.round((v+off)*1000)/1000;
  q=`x = ${n}/${d}<br>y = ${fmtN(y)}`;ex=`Ubah pecahan ke desimal: ${n}/${d} = <b>${fmtN(v)}</b>. Bandingkan dengan y = ${fmtN(y)}.`}
 else if(T==='kuad'){const a=R(2,9),b=R(2,9);x=(a+b)**2;y=a*a+b*b;q=`x = (${a} + ${b})²<br>y = ${a}² + ${b}²`;ex=`x = ${a+b}² = <b>${x}</b>, y = ${a*a} + ${b*b} = <b>${y}</b>. Ingat (a+b)² = a² + 2ab + b², selalu lebih besar dari a² + b² untuk a, b positif.`}
 else {const k=R(3,12);const v=pick(['a','b','c']);
  if(v==='a'){q=`x² = ${k*k}<br>y = ${k}`;rel=3;ex=`x² = ${k*k} berarti x bisa <b>${k} atau −${k}</b>. Kalau x = ${k}, maka x = y. Kalau x = −${k}, maka x &lt; y. Hubungannya tidak pasti, jadi <b>tidak dapat ditentukan</b>.`}
  else if(v==='b'){q=`x² = ${k*k}, dengan x &gt; 0<br>y = ${k}`;rel=2;ex=`Karena ada syarat x &gt; 0, x hanya bisa <b>${k}</b>. Jadi x = y. Perhatikan syarat tambahan di soal, itu yang membedakan dari soal "tidak dapat ditentukan".`}
  else {q=`x = √${k*k}<br>y = ${k}`;rel=2;ex=`Tanda √ selalu menghasilkan nilai <b>positif</b>, jadi √${k*k} = ${k}. Maka x = y. Beda dengan x² = ${k*k} yang punya dua kemungkinan.`}
  return {q:`Diketahui:<br>${q}<br>Hubungan x dan y yang tepat adalah ...`,o:[XYO[rel],...XYO.filter((_,i)=>i!==rel)],a:0,ex}}
 if(Math.abs(x-2*y)<1e-9)continue;rel=Math.abs(x-y)<1e-9?2:x>y?0:1;
 return {q:`Diketahui:<br>${q}<br>Hubungan x dan y yang tepat adalah ...`,o:[XYO[rel],...XYO.filter((_,i)=>i!==rel)],a:0,ex:ex+` Jadi <b>${XYO[rel]}</b>.`}}};

G.aritsos=()=>{const T=pick(['diskon','untung','rugi','bunga','balik','senilai','skala']);
 if(T==='diskon'){const P=R(10,60)*10000,[d1,d2]=shuffle([10,20,25,30,40,50]).slice(0,2),a=P/10000*(100-d1)*(100-d2);
  return {q:`Sebuah barang seharga ${rp(P)} mendapat diskon ${d1}%, lalu diskon lagi ${d2}%. Harga yang harus dibayar adalah ...`,o:mk(a,[P*(100-d1-d2)/100,P*(100-d1)/100,a+10000,a-5000,P*d1*d2/10000],rp),a:0,
   ex:`Diskon bertingkat <b>jangan dijumlah</b>. ${rp(P)} × ${100-d1}% = ${rp(P*(100-d1)/100)}, lalu × ${100-d2}% = <b>${rp(a)}</b>. Kalau langsung ${d1+d2}%, hasilnya ${rp(P*(100-d1-d2)/100)} dan itu jebakan.`}}
 if(T==='untung'){const M=R(5,50)*10000,u=pick([10,15,20,25,30,40]),a=M*(100+u)/100;
  return {q:`Pedagang membeli barang seharga ${rp(M)} dan ingin untung ${u}%. Harga jualnya adalah ...`,o:mk(a,[M*(100-u)/100,M+u*1000,a+5000,M*u/100,a-10000],rp),a:0,ex:`Harga jual = modal × (100% + untung) = ${rp(M)} × ${100+u}% = <b>${rp(a)}</b>.`}}
 if(T==='rugi'){const M=R(4,40)*10000,r=pick([5,10,15,20,25,30]),J=M*(100-r)/100;
  return {q:`Sebuah barang dibeli seharga ${rp(M)} lalu dijual ${rp(J)}. Persentase kerugiannya adalah ...`,o:mk(`${r}%`,[r+5,r-5,r*2,Math.round((M-J)/J*100),r+10,r+15,r+2,r+20].filter(v=>v>0&&v!==r).map(v=>v+'%')),a:0,
   ex:`Rugi = ${rp(M)} − ${rp(J)} = ${rp(M-J)}. Persentase dihitung dari <b>harga beli</b>: ${rp(M-J)} ÷ ${rp(M)} × 100% = <b>${r}%</b>.`}}
 if(T==='bunga'){const M=R(1,10)*1000000,p=pick([6,12]),n=pick([2,4,6,8,10]),b=M*p*n/1200;
  return {q:`Rina menabung ${rp(M)} di bank dengan bunga tunggal ${p}% per tahun. Jumlah tabungannya setelah ${n} bulan adalah ...`,o:mk(M+b,[M+M*p/100,M+b*2,b,M+b/2,M+M*p*n/100],rp),a:0,
   ex:`Bunga = ${rp(M)} × ${p}% × ${n}/12 = ${rp(b)}. Tabungan akhir = ${rp(M)} + ${rp(b)} = <b>${rp(M+b)}</b>. Ingat bunga per <b>tahun</b>, jadi dikali ${n}/12.`}}
 if(T==='balik'){for(;;){const w1=pick([6,8,10,12,15,20]),d1=pick([10,12,15,18,20,24,30]),d2=R(4,d1-2);if((w1*d1)%d2)continue;const w2=w1*d1/d2;if(w2-w1<2||w2>80)continue;
  return {q:`Sebuah pekerjaan dapat diselesaikan ${w1} orang dalam ${d1} hari. Agar selesai dalam ${d2} hari, dibutuhkan tambahan pekerja sebanyak ...`,o:mk(w2-w1,[w2,w1*d2/d1,w2-w1+2,w2-w1-1,d1-d2].filter(v=>v>0&&Number.isInteger(v)),v=>v+' orang'),a:0,
   ex:`Ini perbandingan <b>berbalik nilai</b>: makin banyak orang, makin cepat. Total kerja = ${w1} × ${d1} = ${w1*d1} orang-hari. Untuk ${d2} hari butuh ${w1*d1} ÷ ${d2} = ${w2} orang. Tambahannya ${w2} − ${w1} = <b>${w2-w1} orang</b>.`}}}
 if(T==='senilai'){const k=pick([12,14,15,16]),L=R(3,8),L2=R(9,20);

  {q:'Pada 18 Agustus 1945, rumusan sila pertama dalam Piagam Jakarta diubah menjadi "Ketuhanan Yang Maha Esa". Perubahan ini dilakukan dengan tujuan utama ...',o:['Menghapus peran agama dalam negara','Menjaga persatuan bangsa yang beragam','Menyesuaikan dengan ideologi negara lain','Memenuhi permintaan pemerintah Jepang','Mempersingkat rumusan Pancasila'],a:1,ex:'Perubahan itu disepakati demi <b>persatuan</b>, karena ada keberatan dari wakil Indonesia bagian timur. Mohammad Hatta menyampaikannya setelah berdiskusi dengan tokoh-tokoh Islam. Ini contoh besar mengutamakan kepentingan bangsa.'}

 bahasa:[
  {q:'Penulisan kata baku yang tepat terdapat pada ...',o:['Apotik','Analisa','Kwitansi','Risiko','Hakekat'],a:3,ex:'Bakunya: apotek, analisis, kuitansi, <b>risiko</b>, hakikat.'},
  {q:'Kalimat berikut yang efektif adalah ...',o:['Para peserta-peserta diharapkan hadir tepat waktu.','Bagi peserta yang terlambat harap melapor ke panitia.','Para peserta diharapkan hadir tepat waktu.','Kepada hadirin dipersilakan berdiri.','Harga mobil itu sangat mahal sekali.'],a:2,ex:'"Para peserta-peserta" dan "sangat ... sekali" itu <b>pleonasme</b> (berlebihan). "Bagi ..." dan "Kepada ..." di awal kalimat membuat <b>subjeknya hilang</b>. Yang efektif: <b>Para peserta diharapkan hadir tepat waktu.</b>'},
  {ctx:PARA_DIGI,q:'Gagasan utama paragraf tersebut adalah ...',o:['Pengurusan KTP kini dapat dilakukan secara daring','Digitalisasi layanan publik bermanfaat bagi warga, tetapi aksesnya perlu diperluas','Pungutan liar terjadi karena interaksi tatap muka','Daerah terpencil belum memiliki akses internet','Warga sering antre berjam-jam di kantor pemerintahan'],a:1,ex:'Gagasan utama = <b>ide yang mewadahi seluruh kalimat</b>. KTP daring, pungli, dan internet daerah hanya detail pendukung. Paragraf ini membahas manfaat digitalisasi dan catatannya.'},
  {ctx:PARA_SAMPAH,q:'Gagasan utama paragraf tersebut adalah ...',o:['Nelayan sulit mendapat ikan','Banjir datang setiap musim hujan','Sampah plastik merupakan masalah serius di kota pesisir sehingga mulai ditangani pemerintah daerah','Bank sampah mengelola sampah warga','Kantong plastik sekali pakai dilarang di seluruh Indonesia'],a:2,ex:'Kalimat pertama berisi topik (<b>sampah plastik masalah serius</b>), kalimat tengah jadi buktinya, dan kalimat akhir solusinya. Gagasan utamanya merangkum keduanya. Opsi E melebih-lebihkan isi paragraf.'},
  {q:'Penulisan huruf kapital yang tepat terdapat pada kalimat ...',o:['Ayah dirawat di Rumah Sakit sejak kemarin.','Kami berlibur ke pulau Bali.','Ia berasal dari suku Sunda.','Ibu membeli Gula Jawa di pasar.','Kakak kuliah di universitas Padjadjaran.'],a:2,ex:'Kata "suku" ditulis kecil, nama sukunya kapital: <b>suku Sunda</b> ✓. Yang lain: rumah sakit (bukan nama), <b>Pulau Bali</b> (bagian nama geografi), gula jawa (nama jenis), <b>Universitas Padjadjaran</b> (nama lembaga).'},
  {q:'Penulisan kata depan dan imbuhan yang tepat terdapat pada kalimat ...',o:['Buku itu di letakkan diatas meja.','Buku itu diletakkan di atas meja.','Buku itu diletakkan diatas meja.','Buku itu di letakkan di atas meja.','Buku itu diletak kan di atas meja.'],a:1,ex:'Trik cepat: kalau diikuti <b>tempat</b> (atas, meja, rumah), "di" adalah kata depan dan <b>dipisah</b>. Kalau diikuti <b>kata kerja</b>, "di-" adalah imbuhan dan <b>disambung</b>. Jadi: <b>diletakkan di atas</b>.'},
  {q:'Penulisan kata serapan yang baku adalah ...',o:['Sistim','Kualitas','Kwalitas','Aktifitas','Nasehat'],a:1,ex:'Bakunya: sistem, <b>kualitas</b>, aktivitas, nasihat. Kata serapan dari "-ivity" menjadi <b>-ivitas</b>, bukan -ifitas.'},
  {q:'Kalimat berikut yang tidak efektif karena mengandung pleonasme adalah ...',o:['Kita harus saling membantu.','Kita harus bantu-membantu.','Kita harus saling bantu-membantu.','Rapat dimulai pukul 08.00.','Ia mundur demi kebaikan bersama.'],a:2,ex:'"Saling" dan bentuk ulang "bantu-membantu" <b>sama-sama bermakna timbal balik</b>. Dipakai bersamaan jadi berlebihan. Pakai salah satunya saja.'}

 nasionalisme:[
  {q:'Seorang atlet bulu tangkis menolak tawaran naturalisasi dari negara lain yang menjanjikan gaji jauh lebih besar. Ia tetap membela Indonesia walaupun fasilitas latihannya terbatas. Sikap ini mencerminkan ...',o:['Chauvinisme','Nasionalisme dan rela berkorban','Primordialisme','Etnosentrisme','Sektoralisme'],a:1,ex:'Memilih bangsa sendiri meski harus berkorban = <b>nasionalisme + rela berkorban</b>. Chauvinisme itu merendahkan bangsa lain.'},
  {q:'Sekelompok warga menolak semua produk dan budaya asing, menganggap bangsa lain lebih rendah, bahkan mengusir pedagang dari negara lain. Sikap ini termasuk ...',o:['Nasionalisme Pancasila','Patriotisme','Nasionalisme sempit (chauvinisme)','Kosmopolitanisme','Internasionalisme'],a:2,ex:'Menganggap bangsa lain lebih rendah = <b>chauvinisme</b>.'},

  {q:'Video viral memperlihatkan pembuat konten memakai bendera Merah Putih sebagai alas duduk. Tindakan ini melanggar UU Nomor 24 Tahun 2009 dan menunjukkan lemahnya ...',o:['Kreativitas dalam bermedia sosial','Rasa hormat terhadap simbol negara','Pemahaman tentang HAM','Kebebasan berekspresi','Kemampuan literasi digital'],a:1,ex:'Bendera adalah <b>simbol negara</b> yang wajib dihormati (UU 24/2009).'},
  {q:'Para pejuang mempertahankan Surabaya pada 10 November 1945 walaupun kalah persenjataan dari pasukan Sekutu. Sikap mereka paling tepat disebut ...',o:['Patriotisme','Chauvinisme','Liberalisme','Primordialisme','Kosmopolitanisme'],a:0,ex:'<b>Patriotisme</b> = cinta tanah air yang diwujudkan dengan <b>kesediaan berkorban</b>, bahkan nyawa. Nasionalisme itu rasa kebangsaannya, patriotisme itu aksi pengorbanannya.'},
  {q:'Kampanye "Bangga Buatan Indonesia" yang mengajak masyarakat membeli produk UMKM lokal mencerminkan nasionalisme di bidang ...',o:['Politik','Ekonomi','Pertahanan','Hukum','Agama'],a:1,ex:'Membeli dan memajukan produk dalam negeri = nasionalisme di bidang <b>ekonomi</b>.'},

  {q:'Sebuah kelompok mendeklarasikan kemerdekaan wilayahnya dan menyatakan lepas dari Indonesia melalui siaran pers di luar negeri. Tindakan ini paling bertentangan dengan Pancasila sila ke ...',o:['Pertama','Kedua','Ketiga','Keempat','Kelima'],a:2,ex:'Ancaman disintegrasi, bertabrakan dengan <b>sila ke-3, Persatuan Indonesia</b>.'},
  {q:'Menurut UUD 1945, ketentuan yang tidak dapat dilakukan perubahan adalah ...',o:['Sistem pemerintahan presidensial','Masa jabatan presiden','Bentuk Negara Kesatuan Republik Indonesia','Jumlah anggota MPR','Kewenangan Mahkamah Konstitusi'],a:2,ex:'<b>Pasal 37 ayat (5)</b>: bentuk <b>NKRI tidak dapat diubah</b>.'},
  {q:'Terjadi perselisihan antarwarga tentang pembangunan rumah ibadah di sebuah kompleks. Penyelesaian yang paling sesuai dengan nilai Pancasila adalah ...',o:['Menyerahkan keputusan pada kelompok mayoritas','Musyawarah antarwarga yang difasilitasi pemerintah setempat sesuai aturan','Membiarkan pembangunan tanpa izin','Melarang semua pembangunan rumah ibadah','Menyelesaikan lewat media sosial agar transparan'],a:1,ex:'Sila ke-1 (kebebasan beribadah) + sila ke-4 (<b>musyawarah</b>), sesuai aturan.'},
  {q:'Hal yang membedakan demokrasi Pancasila dari demokrasi liberal adalah ...',o:['Adanya pemilihan umum','Adanya lembaga perwakilan rakyat','Mengutamakan musyawarah mufakat serta keseimbangan hak dan kewajiban','Kebebasan individu tanpa batas','Keputusan selalu diambil melalui voting'],a:2,ex:'Ciri khasnya: <b>musyawarah mufakat</b> dan <b>hak seimbang dengan kewajiban</b>.'},
  {q:'Berikut ini yang bukan termasuk empat konsensus dasar berbangsa dan bernegara adalah ...',o:['Pancasila','UUD 1945','NKRI','Bhinneka Tunggal Ika','Sumpah Pemuda'],a:4,ex:'Empat konsensus (dulu disebut empat pilar): <b>Pancasila, UUD 1945, NKRI, dan Bhinneka Tunggal Ika</b>. Sumpah Pemuda adalah peristiwa sejarah, bukan konsensus dasar.'}

 hotsTWK:[
  {q:'Sebuah pesantren di Jawa Timur dan sebuah desa adat di Bali menjalin program pertukaran pelajar. Santri tinggal beberapa minggu di rumah warga Bali, begitu pula sebaliknya. Program ini dinilai berhasil menumbuhkan saling pengertian antarumat beragama. Nilai yang paling tepat menggambarkan program tersebut adalah ...',o:['Toleransi sebatas tidak saling mengganggu','Bhinneka Tunggal Ika yang diwujudkan melalui interaksi dan saling memahami','Asimilasi budaya agar perbedaan hilang','Sekularisme dalam pendidikan','Primordialisme yang positif'],a:1,ex:'Kata kuncinya <b>berinteraksi dan saling memahami</b>, bukan sekadar membiarkan. Perbedaan tetap ada, tapi menjadi kekuatan. Itu inti <b>Bhinneka Tunggal Ika</b>. Asimilasi salah, karena tujuannya bukan menghapus perbedaan.'},
  {q:'Menjelang pilkada, seorang calon kepala daerah gencar berkampanye bahwa hanya warga dari suku dan agamanya yang layak memimpin daerah tersebut. Analisis yang paling tepat terhadap kampanye itu adalah ...',o:['Sah karena termasuk kebebasan berpendapat','Mengancam persatuan karena memecah masyarakat berdasarkan SARA','Wajar karena mayoritas warga berasal dari suku yang sama','Melanggar hukum hanya jika calon tersebut kalah','Bagian dari strategi politik yang lazim'],a:1,ex:'Kampanye berbasis <b>SARA</b> memecah masyarakat dan bertentangan dengan <b>sila ke-3</b> serta semangat demokrasi Pancasila. Kebebasan berpendapat tetap dibatasi oleh kewajiban menjaga persatuan.'},
  {q:'Pemerintah membangun bendungan untuk irigasi ribuan hektare sawah. Sebagian warga yang tanahnya terdampak menolak pindah. Pemerintah lalu mengadakan dialog, memberikan ganti rugi yang layak, dan membantu relokasi. Langkah pemerintah tersebut mencerminkan ...',o:['Kepentingan pribadi warga harus selalu didahulukan','Kepentingan umum didahulukan, tetapi hak warga tetap dihormati melalui musyawarah dan ganti rugi yang adil','Pemerintah boleh mengambil tanah warga tanpa syarat','Pembangunan sebaiknya dibatalkan bila ada penolakan','Warga wajib menerima keputusan tanpa dialog'],a:1,ex:'Ada dua nilai yang seimbang: <b>kepentingan umum</b> (sila ke-5) dan <b>hak warga lewat musyawarah</b> (sila ke-4). Jawaban HOTS biasanya yang paling <b>seimbang</b>, bukan yang ekstrem.'},
  {q:'Seorang kepala sekolah menerima "titipan" orang tua agar anaknya diterima lewat jalur zonasi dengan alamat domisili palsu. Akibatnya, siswa lain yang benar-benar tinggal di zona itu tidak diterima. Analisis yang paling tepat adalah ...',o:['Hanya pelanggaran administratif kecil','Kolusi dan pemalsuan data yang merampas hak calon siswa lain','Bentuk kepedulian kepala sekolah pada orang tua','Kesalahan sistem zonasi, bukan kesalahan pelaku','Gratifikasi yang boleh asal dilaporkan'],a:1,ex:'Ada kerja sama curang (<b>kolusi</b>) dan <b>pemalsuan data</b>. Dampaknya nyata: <b>hak orang lain dirampas</b>. Soal HOTS integritas biasanya meminta kamu melihat korbannya.'},
  {q:'Seorang perawat memilih bertugas di puskesmas pedalaman Papua yang fasilitasnya minim, padahal ia mendapat tawaran kerja di rumah sakit swasta di kota besar. Tindakan perawat tersebut paling tepat dinilai sebagai ...',o:['Keputusan yang kurang rasional secara ekonomi','Bela negara non-fisik melalui pengabdian sesuai profesinya','Bentuk primordialisme','Kewajiban yang diatur dalam undang-undang','Upaya mencari pengalaman pribadi'],a:1,ex:'Mengabdi sesuai keahlian demi pemerataan layanan = <b>bela negara non-fisik</b>, plus nilai rela berkorban.'},
  {q:'Setelah tim nasional kalah, ribuan warganet Indonesia menyerbu akun media sosial pemain negara lawan dengan hinaan, sampai media internasional memberitakannya. Analisis yang paling tepat adalah ...',o:['Wujud nasionalisme yang tinggi','Nasionalisme sempit yang justru merusak citra bangsa','Kebebasan berekspresi yang dijamin UUD','Hal wajar dalam persaingan olahraga','Bentuk patriotisme digital'],a:1,ex:'Membela bangsa dengan <b>merendahkan bangsa lain</b> adalah nasionalisme sempit. Hasilnya malah merusak citra Indonesia. Nasionalisme Pancasila tetap menjunjung kemanusiaan.'},
  {q:'Sebuah desa menolak pemakaman jenazah warga yang berbeda agama di tempat pemakaman umum desa, padahal tidak ada larangan dalam aturan. Sikap yang paling sesuai dengan nilai Pancasila bagi perangkat desa adalah ...',o:['Mengikuti kehendak mayoritas warga','Memfasilitasi musyawarah dan menegakkan aturan bahwa pemakaman umum terbuka bagi semua warga','Menyarankan keluarga memakamkan di desa lain','Menunda pemakaman sampai warga setuju','Menyerahkan sepenuhnya kepada keluarga jenazah'],a:1,ex:'Perangkat desa harus menegakkan <b>hak yang sama</b> bagi semua warga (sila ke-1 dan ke-2) lewat <b>musyawarah</b>. Mengikuti mayoritas begitu saja mengorbankan hak minoritas.'}

 sinant:[
  {q:'KONKLUSI = ...',o:['Pendahuluan','Kesimpulan','Pertimbangan','Perbandingan','Penjelasan'],a:1,ex:'<b>Konklusi = kesimpulan</b> (ingat "conclusion").'},
  {q:'KONKRET >< ...',o:['Nyata','Jelas','Abstrak','Padat','Kasat mata'],a:2,ex:'Lawan <b>konkret</b> adalah <b>abstrak</b>.'},
  {q:'DISPENSASI = ...',o:['Penundaan','Pembebasan dari kewajiban','Pembagian','Hukuman','Penyaluran'],a:1,ex:'<b>Dispensasi</b> = pengecualian atau pembebasan dari kewajiban.'},
  {q:'NISBI = ...',o:['Mutlak','Relatif','Pasti','Abadi','Nyata'],a:1,ex:'<b>Nisbi = relatif</b>. Mutlak justru lawannya.'},
  {q:'ABSURD >< ...',o:['Mustahil','Aneh','Masuk akal','Rumit','Ganjil'],a:2,ex:'Absurd = tidak masuk akal, lawannya <b>masuk akal</b>.'},
  {q:'MANGKUS = ...',o:['Efisien','Efektif','Lugas','Tangkas','Cakap'],a:1,ex:'<b>Mangkus = efektif</b>, <b>sangkil = efisien</b>.'},
  {q:'PROLOG >< ...',o:['Dialog','Monolog','Epilog','Katalog','Analog'],a:2,ex:'Prolog pembuka, <b>epilog</b> penutup.'},
  {q:'SPORADIS = ...',o:['Terus-menerus','Kadang-kadang','Menyebar luas','Serentak','Teratur'],a:1,ex:'<b>Sporadis</b> = tidak tentu, <b>kadang-kadang</b> muncul. Contoh: hujan turun secara sporadis.'},
  {q:'FRIKSI = ...',o:['Persatuan','Perselisihan','Perkiraan','Pemisahan wilayah','Persetujuan'],a:1,ex:'<b>Friksi</b> = perpecahan atau <b>perselisihan</b> karena beda pendapat.'},
  {q:'NAIF = ...',o:['Cerdik','Lugu','Sombong','Licik','Pemalu'],a:1,ex:'<b>Naif</b> = sangat sederhana pikirannya, <b>lugu</b>.'},
  {q:'PROGRESIF >< ...',o:['Maju','Modern','Konservatif','Dinamis','Agresif'],a:2,ex:'Progresif = ke arah kemajuan. Lawannya <b>konservatif</b>, yaitu mempertahankan keadaan lama.'},
  {q:'AMATIR >< ...',o:['Pemula','Profesional','Penggemar','Relawan','Peserta'],a:1,ex:'Amatir lawannya <b>profesional</b>.'},
  {q:'ELABORASI = ...',o:['Kerja sama','Penjabaran terperinci','Penyederhanaan','Pengumpulan','Perlombaan'],a:1,ex:'<b>Elaborasi</b> = penggarapan atau <b>penjabaran secara terperinci</b>. Jangan tertukar dengan kolaborasi (kerja sama).'},
  {q:'KONTEMPORER = ...',o:['Kuno','Masa kini','Sementara','Tradisional','Abadi'],a:1,ex:'<b>Kontemporer</b> = pada waktu yang sama, <b>masa kini</b>. Sementara itu "temporer" (beda kata).'}

 analogi:[
  {q:'PILOT : PESAWAT = ... : ...',o:['Masinis : Rel','Nakhoda : Kapal','Sopir : Penumpang','Kusir : Kuda','Petani : Sawah'],a:1,ex:'Pola <b>pengemudi : kendaraannya</b>. Nakhoda mengemudikan kapal.'},
  {q:'KUAS : .... = .... : PENULIS',o:['Cat – Buku','Pelukis – Pena','Kanvas – Kertas','Warna – Tinta','Seni – Novel'],a:1,ex:'Kuas : <b>pelukis</b> = <b>pena</b> : penulis. Pola <b>alat : penggunanya</b>.'},
  {q:'AIR : HAUS = .... : ....',o:['Makanan : Lapar','Obat : Dokter','Tidur : Mimpi','Api : Panas','Garam : Asin'],a:0,ex:'Air <b>menghilangkan</b> haus, makanan menghilangkan lapar.'},
  {q:'DOKTER : STETOSKOP = TUKANG KAYU : ...',o:['Rumah','Gergaji','Kayu','Mebel','Bengkel'],a:1,ex:'Pola <b>profesi : alat kerjanya</b>. Kayu itu bahan, bukan alat.'},
  {q:'BENIH : POHON = TELUR : ...',o:['Ayam','Sarang','Cangkang','Kuning telur','Peternak'],a:0,ex:'Benih <b>tumbuh menjadi</b> pohon, telur <b>menetas menjadi</b> ayam. Pola tahap awal : bentuk dewasa.'},
  {q:'GEMPA : SEISMOGRAF = SUHU : ...',o:['Barometer','Termometer','Higrometer','Anemometer','Speedometer'],a:1,ex:'Pola <b>yang diukur : alat ukurnya</b>. Barometer tekanan udara, higrometer kelembapan, anemometer angin.'},
  {q:'LAPAR : MAKAN = MENGANTUK : ...',o:['Malam','Tidur','Lelah','Bantal','Mimpi'],a:1,ex:'Pola <b>keadaan : tindakan untuk mengatasinya</b>.'},
  {q:'RODA : MOBIL = .... : ....',o:['Baling-baling : Helikopter','Pilot : Pesawat','Rel : Kereta','Bensin : Motor','Jalan : Sepeda'],a:0,ex:'Roda adalah <b>bagian yang berputar untuk menggerakkan</b> mobil. Baling-baling juga bagian penggerak helikopter. Rel dan jalan bukan bagian kendaraan.'},
  {q:'KATAK : AMFIBI = ULAR : ...',o:['Mamalia','Reptil','Amfibi','Unggas','Invertebrata'],a:1,ex:'Pola <b>hewan : kelompoknya</b>. Ular termasuk reptil.'},
  {q:'PENA : MENULIS = .... : ....',o:['Gunting : Memotong','Buku : Membaca','Guru : Mengajar','Meja : Belajar','Kertas : Mencatat'],a:0,ex:'Pena adalah <b>alat untuk</b> menulis, gunting <b>alat untuk</b> memotong. Buku itu objek yang dibaca, bukan alat.'}

 silog:[
  {q:'Semua PNS wajib mengikuti apel pagi. Budi adalah PNS. Kesimpulan yang tepat ...',o:['Budi mungkin ikut apel pagi','Budi wajib mengikuti apel pagi','Semua yang ikut apel pagi adalah PNS','Budi tidak wajib apel pagi','Tidak dapat disimpulkan'],a:1,ex:'Semua A adalah B, x adalah A → <b>x adalah B</b>.'},
  {q:'Jika hujan, maka jalan basah. Jalan tidak basah. Kesimpulannya ...',o:['Hujan','Tidak hujan','Mungkin hujan','Jalan kering karena panas','Tidak dapat disimpulkan'],a:1,ex:'<b>Modus tollens</b>: p → q, tidak q, maka <b>tidak p</b>.'},
  {q:'Beberapa mahasiswa suka kopi. Semua penyuka kopi sering begadang. Kesimpulan yang tepat ...',o:['Semua mahasiswa sering begadang','Beberapa mahasiswa sering begadang','Semua yang begadang adalah mahasiswa','Mahasiswa tidak suka begadang','Beberapa penyuka kopi bukan mahasiswa'],a:1,ex:'Premis "beberapa" → kesimpulan "<b>beberapa</b>".'},
  {q:'Ingkaran dari "Semua peserta lulus SKD" adalah ...',o:['Semua peserta tidak lulus SKD','Tidak ada peserta yang lulus SKD','Ada peserta yang tidak lulus SKD','Beberapa peserta lulus SKD','Peserta lulus SKD'],a:2,ex:'Ingkaran "semua" = "<b>ada ... tidak</b>".'},
  {q:'Semua pegawai bank memakai seragam. Sebagian pemakai seragam adalah pegawai baru. Kesimpulan yang tepat adalah ...',o:['Sebagian pegawai bank adalah pegawai baru','Semua pegawai baru adalah pegawai bank','Sebagian pegawai baru tidak memakai seragam','Semua pemakai seragam adalah pegawai bank','Tidak dapat ditarik kesimpulan yang pasti'],a:4,ex:'"Pemakai seragam" itu kelompok besar, pegawai baru berseragam bisa dari tempat lain. <b>Tidak ada kesimpulan pasti</b>.'},
  {q:'Jika harga BBM naik, ongkos angkut naik. Jika ongkos angkut naik, harga sayur naik. Harga sayur tidak naik. Kesimpulannya ...',o:['Harga BBM naik','Ongkos angkut naik','Harga BBM tidak naik','Harga sayur turun','Ongkos angkut tetap tetapi BBM naik'],a:2,ex:'Ujung rantai tidak terjadi → pangkalnya juga tidak. <b>BBM tidak naik</b>.'},
  {q:'Hanya peserta yang lulus SKD yang boleh mengikuti SKB. Rina mengikuti SKB. Kesimpulannya ...',o:['Rina belum tentu lulus SKD','Rina lulus SKD','Rina tidak lulus SKD','Rina lulus SKB','Semua peserta SKD ikut SKB'],a:1,ex:'"<b>Hanya</b>" → ikut SKB pasti lulus SKD.'},
  {q:'Ingkaran dari "Jika hujan, maka saya membawa payung" adalah ...',o:['Jika tidak hujan, maka saya tidak membawa payung','Hujan dan saya tidak membawa payung','Tidak hujan atau saya membawa payung','Jika saya membawa payung, maka hujan','Tidak hujan dan saya membawa payung'],a:1,ex:'Ingkaran p → q = <b>p dan tidak q</b>.'},
  {q:'Semua yang lolos seleksi mengikuti pelatihan. Tidak ada peserta pelatihan yang datang terlambat. Kesimpulannya ...',o:['Semua yang tidak terlambat lolos seleksi','Tidak ada yang lolos seleksi yang datang terlambat','Sebagian yang lolos seleksi datang terlambat','Peserta pelatihan belum tentu lolos seleksi','Semua yang terlambat lolos seleksi'],a:1,ex:'Lolos → pelatihan → tidak terlambat.'},
  {q:'Semua karyawan berprestasi mendapat bonus. Andi tidak mendapat bonus. Kesimpulannya ...',o:['Andi karyawan berprestasi','Andi bukan karyawan berprestasi','Andi mungkin berprestasi','Semua yang tidak mendapat bonus malas','Tidak dapat disimpulkan'],a:1,ex:'Berprestasi → bonus. Tidak bonus → <b>tidak berprestasi</b> (modus tollens versi "semua").'},
  {q:'Jika Dina rajin belajar, ia lulus ujian. Jika Dina tidak rajin belajar, ia dimarahi ibu. Ternyata Dina tidak lulus ujian. Kesimpulannya ...',o:['Dina rajin belajar','Dina lulus ujian','Dina dimarahi ibu','Dina tidak dimarahi ibu','Dina mungkin rajin belajar'],a:2,ex:'Tidak lulus → berarti <b>tidak rajin</b> (modus tollens). Tidak rajin → <b>dimarahi ibu</b> (modus ponens). Dua langkah, tetap pasti.'},
  {q:'Semua dokter adalah lulusan perguruan tinggi. Sebagian dokter gemar menulis. Kesimpulan yang tepat adalah ...',o:['Semua lulusan perguruan tinggi gemar menulis','Sebagian lulusan perguruan tinggi gemar menulis','Semua yang gemar menulis adalah dokter','Sebagian dokter bukan lulusan perguruan tinggi','Tidak dapat disimpulkan'],a:1,ex:'Dokter yang gemar menulis pasti lulusan perguruan tinggi. Jadi <b>sebagian lulusan perguruan tinggi gemar menulis</b>.'}
 ],
 analitis:[
  {ctx:CTX_ANTRE,q:'Siapa yang berdiri paling depan?',o:['P','Q','R','S','T'],a:4,ex:'S di posisi 5. T–P–R berurutan, Q bukan posisi 1, R bukan posisi 4. Susunannya <b>T – P – R – Q – S</b>.'},
  {ctx:CTX_ANTRE,q:'Siapa yang berdiri tepat di depan S?',o:['P','Q','R','T','Tidak dapat ditentukan'],a:1,ex:'Susunan <b>T – P – R – Q – S</b>, jadi tepat di depan S adalah <b>Q</b>.'},
  {ctx:CTX_ANTRE,q:'Pernyataan berikut yang benar adalah ...',o:['P berada di urutan pertama','R berada di urutan ketiga','Q berdiri tepat di belakang T','R berada di belakang Q','T berdiri tepat di depan R'],a:1,ex:'T(1) – P(2) – <b>R(3)</b> – Q(4) – S(5).'},
  {ctx:CTX_RAPAT,q:'Dinas yang dijadwalkan rapat hari Kamis adalah ...',o:['Kesehatan','Pendidikan','Sosial','Perhubungan','Lingkungan'],a:2,ex:'H = Rabu. Kalau K–P di Kamis–Jumat, Senin harus diisi S atau L, padahal keduanya dilarang. Jadi K Senin, P Selasa, <b>S Kamis</b>, L Jumat.'},
  {ctx:CTX_RAPAT,q:'Pernyataan berikut yang pasti benar adalah ...',o:['Pendidikan rapat hari Rabu','Sosial rapat sehari setelah Pendidikan','Lingkungan rapat paling akhir','Kesehatan rapat hari Selasa','Perhubungan rapat sebelum Pendidikan'],a:2,ex:'Senin K, Selasa P, Rabu H, Kamis S, <b>Jumat L</b>.'},
  {ctx:CTX_NILAI,q:'Peserta yang berada di peringkat ketiga adalah ...',o:['A','B','C','D','E'],a:2,ex:'E tertinggi. D > C > A > B > F. Urutannya <b>E, D, C, A, B, F</b>. Peringkat ketiga: <b>C</b>.'},
  {ctx:CTX_NILAI,q:'Peserta dengan nilai terendah adalah ...',o:['A','B','D','F','Tidak dapat ditentukan'],a:3,ex:'Urutannya E, D, C, A, B, <b>F</b>. F di bawah B, dan B di bawah semua yang lain kecuali F.'},
  {ctx:CTX_NILAI,q:'Pernyataan berikut yang benar adalah ...',o:['D mendapat nilai tertinggi','A berada di peringkat keempat','B berada di peringkat ketiga','C lebih rendah daripada A','F berada di peringkat kelima'],a:1,ex:'E(1), D(2), C(3), <b>A(4)</b>, B(5), F(6).'}

 pelayanan:[
  {q:'Seorang warga marah-marah di loket karena berkasnya ditolak sistem, padahal menurutnya sudah lengkap. Saya akan ...',o:['Menjelaskan aturan sistem dan memintanya melengkapi berkas','Mendengarkan keluhannya dengan tenang, mengecek ulang berkas, lalu menjelaskan bagian yang kurang dan cara melengkapinya','Meminta maaf atas ketidaknyamanan dan mengarahkannya ke bagian pengaduan','Mengecek ulang berkasnya untuk memastikan apakah sistem yang keliru','Meminta petugas keamanan menenangkannya'],p:[3,5,2,4,1],ex:'Skor 5: <b>tenang mendengar, mengecek, dan memberi solusi</b>.'},
  {q:'Sistem antrean online di kantor saya sedang gangguan dan warga mulai menumpuk. Saya akan ...',o:['Meminta warga bersabar sampai sistem pulih','Membuat antrean manual, mencatat data warga, dan melaporkan gangguan ke tim TI','Melaporkan gangguan ke tim TI dan menunggu arahan','Melayani warga secara manual sebisanya','Menutup layanan sementara sampai sistem normal'],p:[2,5,3,4,1],ex:'Layanan tetap jalan <b>dan</b> masalah dilaporkan = 5.'},
  {q:'Seorang warga datang 5 menit sebelum jam layanan tutup dengan berkas lengkap. Saya akan ...',o:['Meminta warga datang lagi besok','Melayani sampai selesai dengan ramah meskipun melewati jam kerja','Menerima berkas, memprosesnya besok pagi, dan mengabari warga','Mengarahkan warga ke rekan lain yang masih di meja','Pura-pura sibuk agar warga pergi sendiri'],p:[2,5,4,3,1],ex:'Masih jam layanan dan berkas lengkap: <b>layani sampai tuntas</b>.'},
  {q:'Setelah dilayani, seorang warga memberi amplop sebagai "uang terima kasih". Saya akan ...',o:['Menerima karena diberikan dengan ikhlas','Menerima lalu membaginya dengan rekan','Menolak dengan sopan dan menjelaskan bahwa layanan ini tidak dipungut biaya','Menolak tanpa penjelasan','Menyarankan warga memasukkannya ke kotak amal'],p:[2,1,5,4,3],ex:'Integritas: <b>tolak dengan sopan sekaligus edukasi</b>.'},

function makeQs(L,n=NQ){

 return shuffle(P[L.pool]).slice(0,n)}

let AC=null;
function tone(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime;
 seq.forEach(([f,d,st])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;const t=t0+st;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d+.02)})}catch(e){}}
const sfx={good:()=>tone([[660,.12,0],[990,.2,.09]]),bad:()=>tone([[220,.22,0],[180,.25,.12]]),tap:()=>tone([[520,.05,0]]),win:()=>tone([[523,.15,0],[659,.15,.12],[784,.15,.24],[1047,.35,.36]])};
const cv=document.getElementById('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function confetti(n=140){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
 cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
 const cs=getComputedStyle(document.documentElement);const cols=['--accent','--twk','--tiu','--tkp','--good'].map(v=>cs.getPropertyValue(v).trim());
 for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.4,w:6+Math.random()*6,h:8+Math.random()*8,c:cols[i%cols.length],life:0});
 if(!raf)raf=requestAnimationFrame(step)}
function step(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
 parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*.1)));cx.restore()});
 parts=parts.filter(p=>p.y<innerHeight+40&&p.life<260);raf=parts.length?requestAnimationFrame(step):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

let LS=null;
function heartsGate(){regen();if(S.hearts>0)return true;const wait=Math.ceil((HEART_MS-(Date.now()-S.hts))/60000);
 mbox.innerHTML=`<div style="display:flex;gap:12px;align-items:center">${kepo(60,'sad')}<h2>Hati kamu habis</h2></div><p>Istirahat sebentar. 1 hati pulih dalam ${wait} menit.</p><button class="btn" id="hOk">Oke</button>`;
 modal.hidden=false;document.getElementById('hOk').onclick=()=>modal.hidden=true;return false}
function begin(items,meta){LS=Object.assign({items:items.map(q=>({q:q.q?q:q,retry:false})),pos:0,firstRight:0,combo:0,t0:Date.now(),sel:null,checked:false,total:items.length,doneCount:0,order:null},meta);sfx.tap();renderQ()}
function startLesson(U,L){if(!heartsGate())return;
 const qs=makeQs(L).map(q=>Object.assign({},q,{_tkp:!!L.tkp,_c:U.c,_tag:`${U.id.toUpperCase()} · ${L.title.toUpperCase()}`}));
 begin(qs,{id:lid(U,L),lv:L.lv,c:U.c,title:L.title})}
function startQuick(){if(!heartsGate())return;const pool=[];UNITS.forEach(U=>U.lessons.forEach(L=>{if(lvOpen(U,L.lv))pool.push([U,L])}));
 const qs=[],seen=new Set();for(let t=0;t<60&&qs.length<10;t++){const [U,L]=pick(pool);const q=makeQs(L,1)[0];const key=(q.fig||'')+q.q;if(seen.has(key))continue;seen.add(key);qs.push(Object.assign({},q,{_tkp:!!L.tkp,_c:U.c,_tag:`${U.id.toUpperCase()} · ${L.title.toUpperCase()}`}))}
 begin(qs,{id:null,lv:2,c:'tiu',title:'Latihan Cepat'})}
function renderQ(){const item=LS.items[LS.pos],q=item.q;LS.order=shuffle(q.o.map((_,k)=>k));LS.sel=null;LS.checked=false;
 app.innerHTML=`<main class="lesson screen" style="--c:var(--${q._c});--cbg:var(--${q._c}-bg)">
 <div class="lbar"><button class="x" id="lx" aria-label="Keluar">${I.x}</button>
 <div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${LS.total}" aria-valuenow="${LS.doneCount}"><i id="pg"></i></div>
 <div class="stat st-heart">${I.heart}<span class="tnum" id="hh">${S.hearts}</span></div></div>
 <div class="combo" id="combo"></div>
 <div class="qbody"><span class="chip">${item.retry?'ULANGI SOAL':q._tag}</span>
 ${q.ctx?`<div class="ctx"><b>Bacaan</b>${q.ctx}</div>`:''}${q.fig?`<div class="figbox">${q.fig}</div>`:''}
 <p class="qtext">${q.q}</p>
 <div class="opts ${q.html?'figopts':''}" id="opts">${LS.order.map((k,n)=>`<button class="opt" data-k="${k}" aria-label="Opsi ${'ABCDE'[n]}"><span class="k">${'ABCDE'[n]}</span><span>${q.html?q.o[k]:esc(q.o[k])}</span></button>`).join('')}</div></div>
 <div class="foot"><button class="btn good" id="chk" disabled>Periksa</button></div></main>
 <div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>`;
 requestAnimationFrame(()=>document.getElementById('pg').style.width=(LS.doneCount/LS.total*100)+'%');
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(LS.checked)return;sfx.tap();document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');LS.sel=+b.dataset.k;document.getElementById('chk').disabled=false});
 document.getElementById('chk').onclick=check;
 document.getElementById('lx').onclick=()=>{mbox.innerHTML=`<div style="display:flex;gap:12px;align-items:center">${kepo(60,'sad')}<h2>Yakin berhenti?</h2></div><p>Progres pelajaran ini akan hilang.</p>
  <div style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="mStay">Lanjut belajar</button><button class="btn ghost" id="mQuit" style="color:var(--bad)">Keluar</button></div>`;
  modal.hidden=false;document.getElementById('mStay').onclick=()=>modal.hidden=true;document.getElementById('mQuit').onclick=()=>{modal.hidden=true;LS=null;home()}}}
function check(){if(LS.sel==null||LS.checked)return;LS.checked=true;
 const item=LS.items[LS.pos],q=item.q,tkp=q._tkp;const best=tkp?q.p.indexOf(5):q.a,score=tkp?q.p[LS.sel]:(LS.sel===q.a?5:0);
 const res=score===5?'good':(tkp&&score===4)?'mid':'bad';
 document.querySelectorAll('.opt').forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('sel');if(k===best)b.classList.add('right');else if(k===LS.sel)b.classList.add('wrong');
  if(tkp)b.insertAdjacentHTML('beforeend',`<span class="pts tnum">${q.p[k]} poin</span>`)});
 const comboEl=document.getElementById('combo');
 if(res==='good'){sfx.good();LS.combo++;if(!item.retry)LS.firstRight++;if(LS.combo>=3){comboEl.textContent=`${LS.combo} benar beruntun!`;comboEl.classList.remove('on');void comboEl.offsetWidth;comboEl.classList.add('on')}}
 else{LS.combo=0;comboEl.classList.remove('on');
  if(res==='bad'){sfx.bad();if(S.hearts>=MAXH)S.hts=Date.now();S.hearts=Math.max(0,S.hearts-1);save();document.getElementById('hh').textContent=S.hearts;if(!item.retry)LS.items.push({q,retry:true})}
  else{sfx.good();if(!item.retry)LS.firstRight+=.5}}
 if(res!=='bad'||item.retry)LS.doneCount=Math.min(LS.total,LS.doneCount+1);
 document.getElementById('pg').style.width=(LS.doneCount/LS.total*100)+'%';
 const heads={good:['Mantap, benar!','Pas banget!','Keren!','Betul sekali!'],mid:['Hampir sempurna!'],bad:['Belum tepat']};const h=pick(heads[res]);
 const bestTxt=q.html?'opsi '+'ABCDE'[LS.order.indexOf(best)]:esc(q.o[best]);
 const ans=res==='good'?(tkp?'+5 poin, jawaban terbaik':''):`${tkp?`Kamu dapat ${score} poin. `:''}Jawaban terbaik: ${bestTxt}`;
 const sh=document.getElementById('sheet');sh.className='sheet '+res;
 document.getElementById('sheetIn').innerHTML=`<div class="sh-h"><span class="ic" style="color:var(--${res==='bad'?'bad':res==='good'?'good':'accent-d'})">${res==='bad'?I.cross:res==='good'?I.check:I.star}</span>${h}</div>
 ${ans?`<p class="sh-ans">${ans}</p>`:''}<div class="sh-ex">${q.ex}</div><button class="btn ${res==='bad'?'bad':'good'}" id="nx">${res==='bad'&&!item.retry?'Oke, nanti diulang':'Lanjut'}</button>`;
 requestAnimationFrame(()=>sh.classList.add('on'));document.getElementById('nx').onclick=next;document.getElementById('nx').focus({preventScroll:true})}
function next(){if(S.hearts<=0)return fail();LS.pos++;if(LS.pos>=LS.items.length)return finish();document.getElementById('sheet').classList.remove('on');setTimeout(renderQ,180)}
function fail(){LS=null;app.innerHTML=`<main class="res screen">${kepo(120,'sad')}<h1 style="color:var(--bad)">Hati habis!</h1><p class="sub">Tidak apa-apa, salah itu bagian dari belajar. Hati pulih 1 tiap 10 menit.</p>
 <div class="actions"><button class="btn" id="rHome">Kembali ke peta</button></div></main>`;document.getElementById('rHome').onclick=home}
function finish(){const secs=Math.round((Date.now()-LS.t0)/1000),acc=Math.round(LS.firstRight/LS.total*100),perfect=LS.firstRight>=LS.total;
 const bonus=LS.lv===3?10:LS.lv===2?5:0,gain=10+Math.round(LS.firstRight)+(perfect?5:0)+bonus;
 const before=todayXP(),g=S.goal||20;S.xp+=gain;S.days[today()]=before+gain;
 let unlockMsg='';if(LS.id){const [uid,k]=LS.id.split('-');const U=UNITS.find(x=>x.id===uid),L=U.lessons.find(x=>x.k===k);const wasOpen=L.lv<3&&lvOpen(U,L.lv+1);S.done[LS.id]=(S.done[LS.id]||0)+1;
  if(L.lv<3&&!wasOpen&&lvOpen(U,L.lv+1))unlockMsg=`Level ${L.lv+1} ${U.id.toUpperCase()} terbuka!`}
 const justMet=before<g&&before+gain>=g;if(before+gain>=g)S.met[today()]=1;save();
 const st=streak(),again=LS.id?LS.id:null;const meta={lv:LS.lv};LS=null;sfx.win();
 app.innerHTML=`<main class="res screen">${kepo(120,'happy')}
 <h1>${perfect?'Sempurna!':'Pelajaran selesai!'}</h1><p class="sub">${perfect?'Semua benar di percobaan pertama.':'Soal yang salah sudah kamu ulang. Makin paham!'}</p>
 <div class="cards"><div class="card" style="--c:var(--accent-d)"><h3>TOTAL XP</h3><div class="tnum" id="cXP">0</div></div>
 <div class="card" style="--c:var(--good)"><h3>AKURASI</h3><div class="tnum"><span id="cAcc">0</span>%</div></div>
 <div class="card" style="--c:var(--tiu)"><h3>WAKTU</h3><div class="tnum">${Math.floor(secs/60)}:${pad(secs%60)}</div></div></div>
 ${bonus?`<p class="sub" style="margin:0">Termasuk bonus Level ${meta.lv}: +${bonus} XP</p>`:''}
 <div class="gbar"><div class="row"><span>Target harian</span><span class="tnum">${Math.min(before+gain,g)}/${g} XP</span></div><div class="track"><i id="gb"></i></div></div>
 ${justMet?`<div class="met-banner">Target harian tercapai! Streak sekarang ${st} hari</div>`:''}
 ${unlockMsg?`<div class="met-banner" style="background:var(--tiu);color:#fff">${unlockMsg}</div>`:''}
 <div class="actions"><button class="btn" id="rHome" style="--b:var(--accent);--bd:var(--accent-d);color:var(--accent-ink)">Lanjut</button>
 <button class="btn ghost" id="rAgain">${again?'Ulangi dengan soal baru':'Latihan cepat lagi'}</button></div></main>`;
 countUp(document.getElementById('cXP'),gain);countUp(document.getElementById('cAcc'),acc);
 requestAnimationFrame(()=>document.getElementById('gb').style.width=Math.min(100,(before+gain)/g*100)+'%');
 setTimeout(()=>confetti(justMet||unlockMsg?220:120),250);if(justMet)setTimeout(sfx.win,1000);
 document.getElementById('rHome').onclick=home;
 document.getElementById('rAgain').onclick=()=>{if(!again)return startQuick();const [uid,k]=again.split('-');const U=UNITS.find(x=>x.id===uid);startLesson(U,U.lessons.find(x=>x.k===k))}}

addEventListener('keydown',e=>{if(!LS||!modal.hidden)return;
 if(/^[1-5]$/.test(e.key)&&!LS.checked){const b=document.querySelectorAll('.opt')[+e.key-1];b&&b.click()}
 if(e.key==='Enter'){const nx=document.getElementById('nx'),ck=document.getElementById('chk');if(LS.checked&&nx){e.preventDefault();nx.click()}else if(ck&&!ck.disabled){e.preventDefault();ck.click()}}});
setInterval(()=>{if(!LS){const b=S.hearts;regen();if(S.hearts!==b){const h=document.querySelector('#bHeart span');h&&(h.textContent=S.hearts)}}},30000);
home();if(!S.goal)goalModal(true);
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

</script>

</body></html>
